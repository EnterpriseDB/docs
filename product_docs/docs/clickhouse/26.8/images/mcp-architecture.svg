<svg viewBox="0 0 700 140" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Inter','Segoe UI',sans-serif">
  <title>Three moving parts: an AI client, edb-clickhouse-mcp, and a ClickHouse server</title>
  <desc>An AI client such as Claude Desktop, Claude Code, or Cursor, running on macOS, Windows, or Linux, connects to edb-clickhouse-mcp over stdio when they share a machine, or over HTTP or Server-Sent Events plus authentication when they run on different machines. edb-clickhouse-mcp, installed from the RPM on Linux or from a Docker container, in turn connects to a ClickHouse server over HTTP or HTTPS, wherever that server runs, in Docker, on Linux, or on Kubernetes.</desc>

  <defs>
    <marker id="mcp-ah" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#F89E5D"/>
    </marker>
  </defs>

  <rect width="700" height="140" rx="8" fill="#ffffff"/>

  <!-- Box 1: AI client -->
  <rect x="20" y="15" width="180" height="110" rx="6" fill="#F4F8F9" stroke="#429D9E" stroke-width="1.5"/>
  <text x="110" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#136A7F">AI client</text>
  <text x="110" y="70" text-anchor="middle" font-size="10" fill="#555">Claude Desktop,</text>
  <text x="110" y="85" text-anchor="middle" font-size="10" fill="#555">Claude Code, or Cursor</text>
  <text x="110" y="107" text-anchor="middle" font-size="10" fill="#555">macOS, Windows, or Linux</text>

  <!-- Box 2: edb-clickhouse-mcp -->
  <rect x="260" y="15" width="180" height="110" rx="6" fill="#136A7F"/>
  <text x="350" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">edb-clickhouse-mcp</text>
  <text x="350" y="70" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">MCP server</text>
  <text x="350" y="92" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">RPM: Linux only</text>
  <text x="350" y="107" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.85)">Docker container</text>

  <!-- Box 3: ClickHouse server -->
  <rect x="500" y="15" width="180" height="110" rx="6" fill="#F4F8F9" stroke="#429D9E" stroke-width="1.5"/>
  <text x="590" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#136A7F">ClickHouse server</text>
  <text x="590" y="72" text-anchor="middle" font-size="10" fill="#555">Docker</text>
  <text x="590" y="90" text-anchor="middle" font-size="10" fill="#555">Linux</text>
  <text x="590" y="108" text-anchor="middle" font-size="10" fill="#555">Kubernetes</text>

  <!-- Arrows -->
  <line x1="200" y1="70" x2="256" y2="70" stroke="#F89E5D" stroke-width="1.5" marker-end="url(#mcp-ah)"/>
  <line x1="440" y1="70" x2="496" y2="70" stroke="#F89E5D" stroke-width="1.5" marker-end="url(#mcp-ah)"/>
</svg>
