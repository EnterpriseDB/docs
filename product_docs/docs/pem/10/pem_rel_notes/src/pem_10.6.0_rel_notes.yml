# yaml-language-server: $schema=https://raw.githubusercontent.com/EnterpriseDB/docs/refs/heads/develop/tools/automation/generators/relgen/relnote-schema.json # yamllint disable-line rule:line-length
product: Postgres Enterprise Manager
version: 10.6.0
date: 29 September 2026
intro: |
  New features, enhancements, bug fixes, and security fixes in Postgres Enterprise Manager 10.6.0 include the following:
highlights: |
  - Support for RHEL 10 and Debian 13
  - New **Job Templates** to create reusable job definitions
  - Improved self-monitoring capabilities via the new **Probe Diagnostics** feature
  - Monitor log errors and autovacuum with new built-in probes and alerts
relnotes:
- relnote: |
    Added Kerberos service-ticket authentication mode.
  details: |
    The PEM web tier can now maintain a single shared credential cache from a
    service keytab and connect to the PEM backend as a service principal,
    while PostgreSQL maps the SPN to a database role via `pg_ident.conf` and
    the DSN carries the end user in the `user=` field. Three new
    configuration keys — `PEM_KRB_USE_SERVICE_TICKET`, 
    `PEM_KRB_SERVICE_CACHE_NAME`, and `PEM_USER_KRB_INCLUDE_REALM` — control
    the behaviour.
  type: Enhancement
  jira: PEM-6087
  impact: low

- relnote: |
    Hardened the Content Security Policy with per-request nonces.
  details: |
    The default policy no longer includes `'unsafe-inline'` or 
    `'unsafe-eval'`. Every inline script and style across base templates and
    tool-specific templates (Profiler, Dashboards, Cluster Topology, Reports,
    REST API docs, Barman) is now tagged with a per-request nonce. 
    `style-src` retains `'unsafe-inline'` to accommodate MUI runtime styles; 
    `'unsafe-eval'` is added only in DEBUG builds.
  type: Change
  jira: PEM-6101
  impact: low

- relnote: |
    Added monitoring support for PostgreSQL 19 and EPAS 19.
  details: |
    The probe and alert template surface has been updated to cover the new
    server version.
  type: Enhancement
  jira: PEM-6209
  impact: low

- relnote: |
    Introduced end-to-end password-in-transit encryption.
  details: |
    Browser-to-server credentials are now encrypted with RSA-OAEP: the server
    generates per-session RSA keypairs and the client uses the Web Crypto
    API, with un-decryptable ciphertext rejected as a bad request.
    Feature-gated via `PEM_ENCRYPT_PASSWORDS_IN_TRANSIT`, with an optional 
    `PEM_REQUIRE_TRANSIT_ENCRYPTION` strict-enforcement mode. Operators can
    also supply a custom encryption key for the ASB password store, replacing
    the previously fixed key with an operator-controlled one.
  type: Enhancement
  jira: PEM-6213
  impact: medium

- relnote: |
    Added support for custom, user-managed encryption keys for Agent Server
    Binding (ASB) passwords.
  details: |
    Encryption keys can now be supplied via `PEM_ENC_FILE` or 
    `PEM_ENC_SCRIPT`, enabling key rotation via a key index embedded in the
    encrypted payload.
  type: Enhancement
  jira: PEM-6210
  impact: low

- relnote: |
    Added threshold-aware autovacuum and autoanalyze overdue alerts.
  details: |
    Both alerts now consider per-table size rather than raw time-since-last-run,
    so noisy small tables no longer generate false positives while large
    tables with a genuine backlog surface promptly.
  type: Enhancement
  jira: PEM-6214
  impact: medium

- relnote: |
    Added the `server_log_severity_scan` probe for near-real-time
    PANIC/FATAL/ERROR log alerting.
  details: |
    A format-aware log parser scans server log files continuously, detects
    and cleanly recovers from log rotation, and stores events in 
    `pemdata.server_log_severity_scan`. Timestamp comparison is
    DateStyle-aware so both PostgreSQL and EPAS work correctly.
  type: Enhancement
  jira: PEM-6218
  impact: medium

- relnote: |
    Introduced Job Templates for agent-agnostic, reusable job definitions
    that can fan out to multiple targets.
  details: |
    Job Templates let a single job definition run across many agents instead
    of requiring a separate job per target. Import and export of Job
    Templates is also supported.
  type: Enhancement
  jira: PEM-6233
  impact: high

- relnote: |
    Added a recurring system job to purge data belonging to deleted agents,
    servers, and Barman tools.
  details: |
    The "Purge deleted objects" job runs every 15 minutes and re-evaluates
    the `deleted_objects_data_retention_time` setting on each run, so
    changing the retention threshold also affects entities already awaiting
    purge. Children are drained in bounded batches before the parent row is
    removed, and cleanup covers both the `pem` catalog schema and the 
    `pemdata` / `pemhistory` schemas.
  type: Enhancement
  jira: PEM-6239
  impact: low

- relnote: |
    Added `pem_advisor`, a standalone CLI tuning tool for the PEM backend
    database.
  details: |
    The tool connects read-only and analyzes memory, connections, WAL and
    checkpoints, autovacuum, planner settings, logging, background writer,
    JIT, and replication settings, producing a tiered terminal report as well
    as markdown, SQL, and JSON output. It is compatible with PostgreSQL 17
    and EPAS, and is installed at 
    `/usr/edb/pem/maintenance_tool/bin/pem_advisor`.
  type: Enhancement
  jira: PEM-6240
  impact: medium

- relnote: |
    Added the Probe Diagnostics UI for per-probe health and performance
    investigation.
  type: Enhancement
  jira: PEM-6271
  impact: high

- relnote: |
    Added support for Debian 13 (Trixie) as a customer runtime platform.
  details: |
    New runtime requirements files ship for `debian-13-amd64` and 
    `debian-13-arm64`.
  type: Enhancement
  jira: PEM-6276
  impact: low

- relnote: |
    Bundled HTTPD 2.4.68 with the PEM installer for Windows.
  type: Enhancement
  jira: PEM-6260
  impact: low

- relnote: |
    Added support for RHEL 10 on arm64, ppc64le, and s390x platforms.
  type: Enhancement
  jira: PEM-6215
  impact: low

- relnote: |
    Added the ability to email scheduled reports over SMTP.
  details: |
    Scheduled reports can now be sent as HTML or JSON file attachments over
    SMTP, with the report rendered entirely in the database.
  type: Enhancement
  jira: PEM-6241
  impact: medium

- relnote: |
    Enhanced the agent watchdog subsystem for improved process resilience
    and observability.
  type: Enhancement
  jira: ~
  impact: low

- relnote: |
    Removed BART (Backup and Recovery Tool) support.
  details: |
    All BART references have been retired from the agent, server schema, web
    UI, and packaging.
  type: Deprecation
  jira: ~
  impact: low

- relnote: |
    Fixed an issue whereby the Available Metric tree in Manage Charts (Line
    Charts) did not populate or allow selection, blocking metric selection
    for line-chart configurations.
  type: Bug Fix
  jira: PEM-5715
  impact: low

- relnote: |
    Added threshold ordering validation to the Profile PUT API.
  details: |
    The endpoint now rejects mis-ordered thresholds (ascending required for
    the `>` operator, descending for `<`) on both newly added and modified
    alert configurations, catching mis-configurations at write time instead
    of at alert dispatch time.
  type: Enhancement
  jira: PEM-5978
  impact: low

- relnote: |
    Silenced a benign `SAWarning` surfaced during EPAS schema reflection in
    Alembic migrations.
  details: |
    The warning was harmless but polluted upgrade logs.
  type: Bug Fix
  jira: PEM-5985
  impact: low

- relnote: |
    Hardcoded both the agent heartbeat and server heartbeat intervals to 15
    seconds for consistency.
  details: |
    This removes the previous mismatch where the two intervals could drift
    apart under configuration overrides. You can still configure the heartbeat
    tolerance as in previous versions, but this now affect only the tolerance
    and not the underlying heartbeat intervals.
  type: Change
  jira: PEM-5994
  impact: medium

- relnote: |
    Fixed an issue whereby empty agent, database, schema, or object name
    fields in SNMP trap generation produced "value(s) do not match OID(s)"
    errors at the notification receiver.
  details: |
    An empty field previously collapsed the varbinding; a NULL placeholder
    is now substituted instead.
  type: Bug Fix
  jira: PEM-6024
  impact: low

- relnote: |
    Disabled editing of the Alternate Code tab for system probes in the UI.
  details: |
    The backend already silently rejected such edits; the SQL editor is now
    read-only for system probes so the UI affordance matches the actual
    permission.
  type: Bug Fix
  jira: PEM-6059
  impact: low

- relnote: |
    Applied the Object Explorer tag filter to agent nodes.
  details: |
    Tag-based filtering now behaves consistently across all node types.
    Previously agents were skipped by the filter and remained visible
    regardless of the selected tags.
  type: Bug Fix
  jira: PEM-6086
  impact: medium

- relnote: |
    Fixed an issue whereby customer-customised system-job schedules, 
    `jobenabled` flags, and step code could be silently overwritten across
    reseed events.
  type: Bug Fix
  jira: PEM-6120
  impact: medium
  addresses: 61176

- relnote: |
    Fixed an issue whereby an upgrade left a stale `pem.jobstep` row
    referencing the dropped function `pem.purge_obsolete_data()`, causing
    recurring job failures post-upgrade.
  type: Bug Fix
  jira: PEM-6285
  impact: medium

- relnote: |
    Fixed the column misalignment in the Grid View when column groups are
    present.
  type: Bug Fix
  jira: PEM-6150
  impact: low

- relnote: |
    Fixed an issue whereby special characters (backslash, newline, carriage
    return, tab, and other control characters) in webhook payload values
    could produce invalid JSON and cause the webhook target to reject the
    payload.
  details: |
    These characters are now correctly escaped when substituted into
    webhook payloads.
  type: Bug Fix
  jira: PEM-6152
  impact: low

- relnote: |
    The REST API token endpoint now returns HTTP 403 with an actionable
    "GRANT `pem_rest_api` to ..." message when the caller is missing the
    required role, instead of a misleading HTTP 401.
  type: Bug Fix
  jira: PEM-6156
  impact: low

- relnote: |
    Corrected the display of alert timestamps under non-UTC session
    settings.
  type: Bug Fix
  jira: PEM-6160
  impact: medium

- relnote: |
    Fixed the Validate Binary Path modal so it renders its message as HTML
    instead of showing the raw markup to the user.
  type: Bug Fix
  jira: PEM-6163
  impact: low

- relnote: |
    Fixed the Alert History Report selection semantics.
  details: |
    Choosing **Global + servers/agents** now returns all matching alerts
    (previously only global alerts were returned); a **Global** selection no
    longer overrides other selections; **Cleared** alerts are preserved in the
    summary; and the output now includes target level, unit, and
    database/schema/object context columns.
  type: Bug Fix
  jira: PEM-6170
  impact: low

- relnote: |
    Fixed duplicate and unfiltered Alert Template options in the Profile
    dialog dropdown.
  type: Bug Fix
  jira: PEM-6171
  impact: low

- relnote: |
    Improved the performance of the Grid View in dialogues.
  type: Enhancement
  jira: PEM-6173
  impact: low

- relnote: |
    Fixed an issue whereby a changed agent working directory could break
    subsequent operations because `agent_ssl_key` and `agent_ssl_cert` were
    stored as relative rather than absolute paths.
  details: |
    These values are now converted to absolute paths during agent
    registration.
  type: Bug Fix
  jira: PEM-6174
  impact: medium

- relnote: |
    Fixed a crash on the Custom Dashboard page when a chart without a
    description was added.
  details: |
    The missing description now renders safely instead of aborting the page
    load.
  type: Bug Fix
  jira: PEM-6176
  impact: low

- relnote: |
    Limited the markdown syntax accepted in chart descriptions so free-form
    markdown cannot break the rendering pipeline or introduce style bleed
    into the surrounding UI.
  type: Bug Fix
  jira: PEM-6178
  impact: low

- relnote: |
    The Manage Charts table now auto-refreshes when a new custom chart is
    created, so the newly-created chart appears without requiring a manual
    reload.
  type: Bug Fix
  jira: PEM-6180
  impact: low

- relnote: |
    Fixed empty chart description tooltips for custom charts added to
    Custom Dashboards.
  details: |
    The tooltip now shows the chart's description text.
  type: Bug Fix
  jira: PEM-6181
  impact: low

- relnote: |
    Chart description tooltips in the Custom Dashboard editor can now be
    hovered and scrolled, allowing users to read long descriptions in full.
  type: Bug Fix
  jira: PEM-6183
  impact: low

- relnote: |
    Removed the 24-hour cap on scheduled alert blackout duration.
  details: |
    The REST API v17 endpoint now accepts any positive integer number of
    hours; the legacy endpoint still accepts the "N hour(s)" string form; and
    the UI field validates a minimum of 1. Operators can now schedule
    multi-day maintenance windows in a single blackout.
  type: Change
  jira: PEM-6207
  impact: medium
  addresses: 62855

- relnote: |
    Inherited table columns are now correctly read-only and non-removable
    across every entry point.
  details: |
    The hardcoded OID and Definition-tab type restriction were removed and
    replaced with proper checks on both the `inheritedfrom` and 
    `inheritedfromtable` gates. Foreign-table inline `edit_types` filtering
    is also fixed, along with readonly checks for `attstattarget` and 
    `attstorage`. An ERD regression caused by the same issue was also
    corrected.
  type: Bug Fix
  jira: PEM-6216
  impact: low

- relnote: |
    Timestamps in alert and BDR nested detail tables are now localised to
    the user's session timezone.
  type: Bug Fix
  jira: PEM-6217
  impact: low

- relnote: |
    Duplicate webhook name validation now runs on Add rather than only on
    Save, so the user is warned earlier in the flow.
  type: Enhancement
  jira: PEM-6219
  impact: low

- relnote: |
    Fixed the Manage Profiles grid not extending to the panel bottom, and
    the error toast overlapping data rows.
  type: Bug Fix
  jira: PEM-6220
  impact: low

- relnote: |
    Fixed an issue whereby non-2xx webhook responses were silently marked as
    a successful delivery.
  details: |
    HTTP error response handling for webhook payloads now correctly reports
    non-2xx responses as failures.
  type: Bug Fix
  jira: PEM-6225
  impact: low

- relnote: |
    Fixed login for Kerberos users whose email in the PEM directory is
    stored as `user@REALM`.
  details: |
    When `PEM_USER_KRB_INCLUDE_REALM` is `False`, the realm is now stripped
    from the username used for role lookup, but the full principal is
    retained as the email so user validation succeeds.
  type: Bug Fix
  jira: PEM-6232
  impact: low

- relnote: |
    Custom probes can now carry a user-specified internal name.
  details: |
    The create dialog adds an "Internal name" field that auto-populates as 
    `cp_` plus a slug and is editable during creation (read-only
    afterwards). The `cp_` prefix is mandatory and the remainder must match 
    `[a-z0-9_]+`.
  type: Enhancement
  jira: PEM-6238
  impact: low

- relnote: |
    Fixed an issue whereby alert row expansion could collapse or jump to the
    wrong row when the underlying data refreshed.
  details: |
    Row expansion is now bound to row identity rather than display position.
  type: Bug Fix
  jira: PEM-6242
  impact: low

- relnote: |
    Fixed an issue whereby new server registrations could produce a template
    error because `post_connection_sql` was not set on `server_options`
    insert.
  type: Bug Fix
  jira: PEM-6255
  impact: low

- relnote: |
    Prevented duplicate `server_group` rows from being created when
    multiple agents register concurrently against the same server group.
  type: Bug Fix
  jira: PEM-6259
  impact: medium

- relnote: |
    Fixed the Dashboard tab restore path so that, after a browser refresh,
    the correct content is shown for each restored tab.
  details: |
    Previously a restored tab could show the content from a different tab.
  type: Bug Fix
  jira: PEM-6261
  impact: low

- relnote: |
    Fixed `settings.get_tool_data` returning HTTP 404 for dashboard tabs,
    which broke PEM tab restore on page reload.
  type: Bug Fix
  jira: PEM-6262
  impact: low

- relnote: |
    Documented the required fields for `probe_columns` in the v17 OpenAPI
    spec and corrected the HTTP status returned for column validation
    failures from 500 to 400.
  type: Bug Fix
  jira: PEM-6264
  impact: low

- relnote: |
    Scoped the PGD raft leader-id alert per node group.
  details: |
    PGD 5 raft subgroups elect leaders independently, so the alert now
    includes `node_group_name` in the probe key columns, the data and
    history tables, the chart, and the alert template.
  type: Bug Fix
  jira: PEM-6265
  impact: medium
  addresses: 63967

- relnote: |
    Fixed the Auto Create toggle not appearing on Server-level and
    Agent-level alert templates.
  type: Bug Fix
  jira: PEM-6266
  impact: low

- relnote: |
    Fixed alert template PUT returning HTTP 500 due to a positional dict-row
    index.
  details: |
    Probe lookup is now keyed on column name instead of position.
  type: Bug Fix
  jira: PEM-6267
  impact: low

- relnote: |
    Fixed a crash in the Performance Diagnostics Query Dashboard that fired
    when a collected sample had no matching active session.
  details: |
    The wait-events timeline drill-down is also hardened against similar
    null cases.
  type: Bug Fix
  jira: PEM-6280
  impact: medium

- relnote: |
    Preserved job-step run history when a step is removed from a job.
  details: |
    Deleted steps are now parked (marked as removed and disabled) so they
    disappear from the UI, while the job step log history survives for audit
    and troubleshooting.
  type: Bug Fix
  jira: PEM-6283
  impact: low

- relnote: |
    Users holding the **Scheduled Tasks** role can now see and manage jobs on
    their own agents.
  details: |
    System jobs remain admin-only, and schedule exceptions (skip dates) are
    covered by the same scope.
  type: Enhancement
  jira: PEM-6288
  impact: low

- relnote: |
    Resolved dashboard tab titles on the backend so remotely monitored
    servers open the correct dashboard tab.
  details: |
    Previously the tab could resolve to the wrong monitored server.
  type: Bug Fix
  jira: PEM-6290
  impact: medium
  addresses: 64640

- relnote: |
    Fixed schedule exceptions not appearing in the job dialog.
  details: |
    The server sends exceptions as three arrays; these are now correctly
    converted for display when a job's properties are loaded, not only when
    saved. Also fixed saving exceptions on a newly-added schedule during a
    job update.
  type: Bug Fix
  jira: PEM-6297
  impact: low

- relnote: |
    Fixed the Database cleanup upgrade script to use `CALL` instead of 
    `SELECT` for stored-procedure invocations, matching the
    procedure-vs-function change for `pem.purge_probe_history`.
  details: |
    A subsequent update fixes any already-upgraded systems whose steps were
    left using `SELECT`.
  type: Bug Fix
  jira: PEM-6298
  impact: medium
  addresses: 65129

- relnote: |
    Fixed a schedule with only a start date so it runs once at the specified
    time instead of firing every two minutes.
  details: |
    Empty pattern arrays are no longer implicitly treated as wildcards.
  type: Bug Fix
  jira: PEM-6300
  impact: medium

- relnote: |
    Fixed an issue whereby agents could open two heartbeat connections (and
    two main-thread connections) instead of one.
  details: |
    The heartbeat thread now waits for the old thread to exit before
    recreating it, so two threads holding separate connections can no
    longer coexist.
  type: Bug Fix
  jira: PEM-6308
  impact: medium

- relnote: |
    Fixed an issue whereby the `os_info` probe incorrectly populated 
    `os_start_time` with a 12-hour based timestamp value.
  type: Bug Fix
  jira: PEM-6345
  impact: low

- relnote: |
    Added a portable way to check whether IPv6 is enabled.
  type: Enhancement
  jira: PEM-6254
  impact: low

- relnote: |
    Fixed an issue whereby Reset Layout only reset the default workspace
    docker.
  type: Bug Fix
  jira: PEM-6361
  impact: low

- relnote: |
    Fixed an issue whereby the job properties tab showed Last Result as
    Failure for jobs that never ran.
  type: Bug Fix
  jira: PEM-6338
  impact: low

- relnote: |
    Fixed an issue whereby the Scheduled Task log file showed an "invalid
    date".
  type: Bug Fix
  jira: PEM-6337
  impact: low

- relnote: |
    Fixed an issue whereby the UI accepted a negative or zero value for
    agent heartbeat tolerance.
  type: Bug Fix
  jira: PEM-6296
  impact: low

- relnote: |
    Added indexes on `pem.probe_target_view` to improve performance.
  details: |
    New indexes on the `agent_id` and `probe_internal_name` columns speed up
    probe-target lookups.
  type: Enhancement
  jira: PEM-6356
  impact: low

- relnote: |
    Fixed an issue whereby agent registration could hang or fail with a lock
    timeout while the probe target materialized view was refreshing on
    large fleets.
  type: Bug Fix
  jira: PEM-6363
  impact: medium

- relnote: |
    Fixed CVE-2026-86861, a symlink time-of-check-to-time-of-use (TOCTOU)
    vulnerability in the File Manager.
  details: |
    Closed a race window in `save_file` that could allow a leaf symlink to
    redirect a save operation to an unintended path.
  type: Security
  jira: PEM-6299
  impact: medium

- relnote: |
    Fixed CVE-2026-86864, a vulnerability whereby the backup database was
    not passed via `PGDATABASE`.
  type: Security
  jira: PEM-6299
  impact: medium

- relnote: |
    Fixed CVE-2026-86862, a vulnerability whereby the restore/maintenance
    database was not passed via `PGDATABASE`.
  type: Security
  jira: PEM-6299
  impact: medium

- relnote: |
    Fixed an issue whereby some tree icons were missing.
  type: Bug Fix
  jira: ~
  impact: low
