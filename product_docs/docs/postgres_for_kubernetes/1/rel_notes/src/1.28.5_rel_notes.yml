# yaml-language-server: $schema=https://raw.githubusercontent.com/EnterpriseDB/docs/refs/heads/develop/tools/automation/generators/relgen/relnote-schema.json
product: EDB CloudNativePG Cluster
version: 1.28.5
date: 25 September 2026
intro: |
  This release of EDB Postgres® AI for CloudNativePG™ Cluster includes the following:
components:
  "Operator": 1.28.5
  "CNP plugin": 1.28.5
  upstream-merge: Upstream [1.28.5](https://cloudnative-pg.io/docs/1.28/release_notes/v1.28/)
relnotes:
- relnote: |
    Added `spec.postgresql.epas.tde.keyLength` (128, the default, or 256) so EPAS
    and PG Extended clusters can move to AES-256 Transparent Data Encryption.
  details: |
    Requires EPAS or PG Extended 16 or newer; the field is immutable after
    creation, since changing it would need re-encrypting existing data. Major
    upgrades now derive the key length from the old data directory instead of
    trusting the spec.
  jira: CNP-9287
  addresses:
  type: Enhancement
  impact: High

- relnote: |
    Added `restoreAdditionalCommandArgs` to `.barmanObjectStore.data` for in-tree
    Barman Cloud recoveries, so custom flags are forwarded to
    `barman-cloud-restore` during recovery.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11278">#11278</a>
  type: Enhancement
  impact: High

- relnote: |
    Plugin authors no longer need to re-derive whether an empty WAL archive should
    be treated as an error: the operator now computes the
    `check_empty_wal_archive` decision once and passes it to CNPG-I plugins on
    both WAL archiving and restore hooks.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11216">#11216</a>
  type: Enhancement
  impact: High

- relnote: |
    Allowed setting the `ssl_ecdh_curve` PostgreSQL parameter in
    `.spec.postgresql.parameters`.
  details: |
    It was previously rejected by the validating webhook even though the operator
    does not manage it. Contributed by @Jamstah.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11308">#11308</a>
  type: Enhancement
  impact: High

- relnote: |
    Added support for setting `auth_user` in `spec.pgbouncer.parameters` to
    override the user PgBouncer uses for its `auth_query` connection, instead of
    always deriving it from the `authQuerySecret`.
  details: |
    Useful with a custom `authQuerySecret` where the role to authenticate as
    differs from the one implied by the Secret. Contributed by @jonasbadstuebner.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/10899">#10899</a>
  type: Enhancement
  impact: High

- relnote: |
    Fixed PgBouncer metrics silently reporting zero when PgBouncer adds or
    reorders columns: `SHOW STATS` and `SHOW POOLS` results are now matched by
    column name instead of by position.
  details: |
    Contributed by @AdzerKI (`SHOW STATS`).
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11366">#11366</a>, <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11464">#11464</a>
  type: Enhancement
  impact: High

- relnote: |
    Added a `--dry-run` option to the `backup` command that prints the `Backup`
    resource that would be created, without creating it.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11233">#11233</a>
  type: Enhancement
  impact: High

- relnote: |
    Fixed a webhook validation bypass where an absolute extension path with an
    embedded `..` traversal (e.g. `/a/../../../../etc`) was accepted because only
    the raw path was checked; such paths still escaped the extension's mount point
    once resolved at runtime.
  details: |
    Affected entries are now resolved and rejected/skipped consistently across
    admission, the major-upgrade job, and already-persisted Cluster specs.
    Contributed by @Anand-240.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11210">#11210</a>
  type: Security
  impact: High

- relnote: |
    Updated `google.golang.org/grpc` to v1.83.1, fixing
    [CVE-2026-84304](https://nvd.nist.gov/vuln/detail/CVE-2026-84304) /
    GHSA-vp52-pcj8-j9qc (gRPC-Go heap memory exhaustion via HTTP/2 DATA frame
    fragmentation).
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11394">#11394</a>
  type: Security
  impact: High

- relnote: |
    Updated the default PostgreSQL operand image to 18.6-standard-ubi9.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11257">#11257</a>
  type: Change
  impact: High

- relnote: |
    Demoted an unreachable old primary immediately during failover, instead of
    waiting on checkpoint and fast-shutdown attempts that could never complete.
  details: |
    Previously, an old primary whose PostgreSQL had become unresponsive was never
    shut down, so it could never rejoin the cluster as a replica of the new
    primary. The shutdown is now requested without blocking the reconciler, though
    demotion can still take up to a minute or more if PostgreSQL keeps ignoring
    shutdown signals.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11347">#11347</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed failover and Pod recreation getting stuck while any instance in the
    cluster was fenced.
  details: |
    A fenced instance kept reporting itself as healthy on its status endpoint even
    though its Pod was permanently not Ready, which blocked the readiness guard,
    the primary-election logic, and the Pod-reattachment gate from reacting to an
    unrelated failure elsewhere in the cluster, leaving it stalled until someone
    manually removed the fencing. All three now recognize and skip fenced
    instances.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11274">#11274</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed a failover that could stall forever or get silently reverted.
  details: |
    While a failover was pending, the reconciler could skip checking whether it
    was ready to complete, or mistake the pending state for a missing Pod and
    reset the target primary back to the unhealthy one. It now keeps progressing a
    pending failover and completes it once the WAL receivers are down, rechecking
    quorum safety right before promoting in case it changed while waiting.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11336">#11336</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed the designated-primary sort in `PostgresqlStatusList` so a tie on LSN no
    longer sorts it out of order.
  details: |
    If the designated primary's Pod later disappeared from the status list, this
    could have led the operator to promote the wrong standby.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11494">#11494</a>
  type: Bug Fix
  impact: High

- relnote: |
    Stopped abandoning a fast shutdown after 60 seconds.
  details: |
    The request carried no explicit timeout, so `pg_ctl` fell back to its own
    implicit 60-second limit, and the instance manager, being PID 1 in the
    container, took PostgreSQL down mid-shutdown regardless of a larger configured
    `stopDelay`. The fast phase now waits for the full `stopDelay` instead.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11263">#11263</a>
  type: Bug Fix
  impact: High

- relnote: |
    Waited for certificate status before refreshing secrets during bootstrap.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11450">#11450</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed in-tree Barman Cloud recovery ignoring `wal.maxParallel` and
    `wal.restoreAdditionalCommandArgs`, fetching WAL one segment at a time instead
    of using the configured parallelism.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11105">#11105</a>
  type: Bug Fix
  impact: High

- relnote: |
    Honored the `unrecoverable` annotation on pending and terminating instances.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11241">#11241</a>
  type: Bug Fix
  impact: High

- relnote: |
    Honored `Backup.spec.online` when finalizing VolumeSnapshot-based backups, so
    a cold backup is no longer reported as online in status.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11276">#11276</a>
  type: Bug Fix
  impact: High

- relnote: |
    Retried volume snapshot backups on transient instance-manager connection
    errors (e.g. a dial timeout from a brief pod-network disruption), instead of
    failing the backup outright.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11069">#11069</a>
  type: Bug Fix
  impact: High

- relnote: |
    Set `--no-data-checksums` explicitly when `.spec.postgresql.dataChecksums` is
    `false` on PostgreSQL 18+, which now enables checksums by default in `initdb`.
  details: |
    Contributed by @evan314159.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11488">#11488</a>
  type: Bug Fix
  impact: High

- relnote: |
    Stopped discarding `.spec.inheritedMetadata` labels on PVC reconciliation;
    they were applied before, and then overwritten by, the operator's own labels.
  details: |
    Contributed by @GellertBabel.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11499">#11499</a>
  type: Bug Fix
  impact: High

- relnote: |
    Stopped `Pooler` and `DatabaseRole` from recreating their owned resources
    after being marked for deletion, which could block an external finalizer (e.g.
  details: |
    ArgoCD foreground deletion) waiting for those resources to disappear.
    Contributed by @mjlshen.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11359">#11359</a>
  type: Bug Fix
  impact: High

- relnote: |
    Handled a `NULL` `stats_reset` value in the `pg_stat_wal` metric, which could
    occasionally break Prometheus scraping on PostgreSQL 18 clusters.
  details: |
    Contributed by @HoniSanders.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11207">#11207</a>
  type: Bug Fix
  impact: High

- relnote: |
    Recovered log streaming when a stale non-FIFO file blocked the log pipe.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11246">#11246</a>
  type: Bug Fix
  impact: High

- relnote: |
    Stopped sampling logs of the Pods' processes, so no log lines are silently
    dropped.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11131">#11131</a>
  type: Bug Fix
  impact: High

- relnote: |
    Stopped caching Helm release Secrets in the operator, which could spike memory
    usage and crashloop the operator on clusters with large Helm releases
    installed alongside it.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11211">#11211</a>
  type: Bug Fix
  impact: High

- relnote: |
    Re-ran owned-resource finalizer cleanup after an operator restart, so a
    namespace deleted while the operator was down doesn't hang in `Terminating`
    forever.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11215">#11215</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed rejoining replicas taking a long time to complete `pg_rewind` when WAL
    prefetching (`wal.maxParallel > 1`) was enabled.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11204">#11204</a>
  type: Bug Fix
  impact: High

- relnote: |
    Treated a PostgreSQL instance rejecting connections as started up in probes.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11152">#11152</a>
  type: Bug Fix
  impact: High

- relnote: |
    Stopped issuing a redundant PATCH on every reconciliation when a cluster's
    `pvcTemplate` set `volumeAttributesClass`.
  details: |
    Contributed by @andrew-farries.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11196">#11196</a>
  type: Bug Fix
  impact: High

- relnote: |
    Stopped halting replication slot reconciliation at the first failing slot.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11119">#11119</a>
  type: Bug Fix
  impact: High

- relnote: |
    During rollouts, compared the running configuration hash, rather than the
    on-disk one, avoiding unnecessary switchovers.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11130">#11130</a>
  type: Bug Fix
  impact: High

- relnote: |
    Retried `VolumeSnapshot` errors until the deadline, instead of giving up
    early.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11132">#11132</a>
  type: Bug Fix
  impact: High

- relnote: |
    Symlinked `pg_wal` to the WAL volume during plugin-based recovery, instead of
    replaying WAL onto the data volume, which could exhaust it on a large
    point-in-time recovery.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11127">#11127</a>
  type: Bug Fix
  impact: High

- relnote: |
    Corrected grammar in `PhaseUpgradeDelayed` status messages.
  details: |
    Contributed by @Utkarsh-sharma47.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11065">#11065</a>
  type: Bug Fix
  impact: High

- relnote: |
    Reported the Postgres capabilities of a plugin correctly.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11447">#11447</a>
  type: Bug Fix
  impact: High

- relnote: |
    Prevented the plugin status field from flapping on Cluster reconciliation.
  details: |
    Contributed by @sharifmshaker.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11386">#11386</a>
  type: Bug Fix
  impact: High

- relnote: |
    Used UTC time zone for the default backup name.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11329">#11329</a>
  type: Bug Fix
  impact: High

- relnote: |
    Deleted PVCs before Pods in `cnp destroy`, avoiding a race that could leave
    dangling PVCs needing a second invocation to clean up.
  details: |
    Contributed by @daanvinken.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/10847">#10847</a>
  type: Bug Fix
  impact: High

