# yaml-language-server: $schema=https://raw.githubusercontent.com/EnterpriseDB/docs/refs/heads/develop/tools/automation/generators/relgen/relnote-schema.json
product: EDB CloudNativePG Cluster
version: 1.30.2
date: 17 November 2026
intro: |
  This release of EDB Postgres® AI for CloudNativePG™ Cluster includes the following:
components:
  "Operator": 1.30.2
  "CNP plugin": 1.30.2
  upstream-merge: Upstream [1.30.2](https://cloudnative-pg.io/docs/1.30/release_notes/v1.30/)
highlights: |
  **PostgreSQL 18.7 is the new default image**: the default operand image is now
  `18.7-standard-ubi9`, which fixes several CVEs. It applies only to new
  clusters that don't set an image. To get the fixes, update existing clusters
  to 18.7, 17.12, 16.16 or 15.20 by changing `imageName` or the `ImageCatalog`.
  Before updating, read the [PostgreSQL 18.7
  announcement](https://www.postgresql.org/about/news/postgresql-187-1712-1616-1520-1425-and-19-rc-2-released-3442/)
  and the release notes it links.
  ([#11833](https://github.com/cloudnative-pg/cloudnative-pg/pull/11833))

  **PostgreSQL 14 is no longer supported**: the PostgreSQL community stopped
  fixing PostgreSQL 14 on November 12, 2026, and EDB Postgres for Kubernetes
  supports a major version only as long as PostgreSQL does. If you still run
  PostgreSQL 14, plan an upgrade to a newer major version. PostgreSQL 15 stops
  receiving fixes on November 11, 2027.
  ([#11935](https://github.com/cloudnative-pg/cloudnative-pg/pull/11935))

  The operator now needs the `delete` permission on `leases`. Users who manage
  the RBAC manually must add it.
  ([#11609](https://github.com/cloudnative-pg/cloudnative-pg/pull/11609))
relnotes:
- relnote: |
    Streaming retry for standbys on the WAL archive
  details: |
    PostgreSQL tries streaming only after a restore from the archive fails. If WAL
    is produced about as fast as it is restored, that may never happen, and the
    standby stays on the archive, with no WAL receiver and no part in synchronous
    replication. Now, after 30 seconds of continuous restores, WAL restore fails
    on purpose for 5 seconds, so PostgreSQL tries streaming. These failures are
    expected and can appear in the logs.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11868">#11868</a>
  type: Enhancement
  impact: High

- relnote: |
    Server-side encryption with customer-provided keys (SSE-C)
  details: |
    added `sseCustomerKey` in `s3Credentials`, to use SSE-C with S3-compatible
    object stores. It works with backups, WAL archiving and recovery.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11711">#11711</a>, <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11775">#11775</a>
  type: Enhancement
  impact: High

- relnote: |
    `Backup` and `ScheduledBackup` resources that use the `barmanObjectStore`
    method now return an admission warning about the removal of native Barman
    Cloud support in 1.32, as `Cluster` resources already did.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11725">#11725</a>
  type: Enhancement
  impact: High

- relnote: |
    `extension_control_path` and `dynamic_library_path` no longer list directories
    that are missing from an extension image, for example `share` in an image that
    ships only `lib`.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11652">#11652</a>
  type: Enhancement
  impact: High

- relnote: |
    Transient network errors from `barman-cloud-wal-restore` are now logged (needs
    Barman 3.20.0 or later).
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11541">#11541</a>
  type: Enhancement
  impact: High

- relnote: |
    Moved the "Defaulting for ..." operator log lines from info to debug level.
  details: |
    They were printed at every reconciliation and hid other messages.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11790">#11790</a>
  type: Enhancement
  impact: High

- relnote: |
    `kubectl cnp status` no longer fails without the `pods/exec` permission.
  details: |
    It shows `not permitted: requires the pods/exec permission` instead of the
    size and configuration sections.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11687">#11687</a>
  type: Enhancement
  impact: High

- relnote: |
    Updated `golang.org/x/net` to v0.62.0, fixing GO-2026-6617, GO-2026-6612,
    GO-2026-6611, GO-2026-6610, GO-2026-6603, GO-2026-6860 and GO-2026-6866, and
    bumped the other `golang.org/x` modules.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11631">#11631</a>, <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11867">#11867</a>
  type: Security
  impact: High

- relnote: |
    Updated the default PgBouncer image from 1.25.2 to 1.26.1.
  details: |
    Poolers that use the default image roll out the new version when the operator
    is upgraded.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11571">#11571</a>, <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11704">#11704</a>
  type: Change
  impact: High

- relnote: |
    Updated the `barman-cloud` library to v0.7.0, which skips failed backups when
    it reads the backup catalog.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11711">#11711</a>
  type: Change
  impact: High

- relnote: |
    Fixed enabling a sidecar plugin on a running cluster.
  details: |
    Pods created before that have no sidecar until they are recreated. They logged
    `Unknown plugin` errors, their metrics scrapes failed, and a switchover could
    wait forever. When the plugin archives WAL, the former primary crash looped
    until the Pod was deleted. The operator now recreates it.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11858">#11858</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed replicas created from an online volume snapshot ignoring the
    `backup_label` and `tablespace_map` stored in the snapshot.
  details: |
    PostgreSQL did crash recovery and did not fetch WAL from the archive.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11847">#11847</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed logical decoding stalling while a new replica was bootstrapping, with
    `synchronizeLogicalDecoding` enabled.
  details: |
    The replica is now left out of `synchronized_standby_slots` (or
    `pg_failover_slots.standby_slot_names`) until its volume is initialized.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11802">#11802</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed `status.phaseReason` being cleared and set again several times a second
    while a cluster was being created or changed, for example "Some instances are
    not yet active".
  details: |
    This loaded the API server and made `kubectl get cluster -w` noisy.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11789">#11789</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed the operator retrying instance status requests that failed with an error
    response, as if the failure was a network error.
  details: |
    During a switchover the old primary answers with an error while PostgreSQL is
    stopped, so each reconciliation waited about 1.6 seconds, which slowed the
    whole switchover. Contributed by @kabbydriver.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11793">#11793</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed the WAL count and size metrics counting `.partial`, `.backup` and
    `.history` files.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/9967">#9967</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed replicas crash looping with `recovery aborted because of insufficient
    parameter settings` after a hot standby parameter such as `max_connections`
    was removed from `.spec.postgresql.parameters`.
  details: |
    Contributed by @ichibahn.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11236">#11236</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed the instance manager waiting forever on a frozen postmaster, one that
    accepts connections but never answers.
  details: |
    This blocked the instance status, the metrics exporter and the check before an
    in-tree backup. Local connection attempts to PostgreSQL now time out after 5
    seconds.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11718">#11718</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed a `Cluster` recreated over leftover resources (for example by a backup
    tool) staying in `Unable to create required cluster objects` with `cannot set
    an ownerRef on a resource you can't delete`.
  details: |
    This happened with the `OwnerReferencesPermissionEnforcement` admission
    plugin. When restoring over orphan PVCs, the operator now deletes the stale
    primary `Lease`, so the new primary does not wait for it to expire.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11609">#11609</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed WAL restore reporting the end of the WAL archive on the wrong timeline.
  details: |
    A replica restored from a snapshot could miss valid WAL of the new timeline
    and replay WAL of the parent timeline instead. Contributed by @ardentperf.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11133">#11133</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed a `Cluster` not being reconciled again when a plugin asked for a retry
    without a delay.
  details: |
    For example, a `Cluster` created before the `ObjectStore` of the Barman Cloud
    plugin stayed in `BootstrapPending`. The operator now retries after one
    second. Contributed by @valeriodelsarto.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11683">#11683</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed `ConsistentSystemID` turning `False` while PostgreSQL is not running,
    for example in replica clusters after a demotion, or on fenced instances.
  details: |
    The system ID is now read from disk, so it no longer needs a running
    PostgreSQL.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11645">#11645</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed a `Backup` that could be started more than once, or moved back to
    `pending` after it started.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11617">#11617</a>
  type: Bug Fix
  impact: High

- relnote: |
    Fixed `kubectl cnp backup` for volume snapshot backups: when only one of
    `--immediate-checkpoint` and `--wait-for-archive` was set, the other option
    used its default instead of the value in
    `.spec.backup.volumeSnapshot.onlineConfiguration`.
  jira:
  addresses: <a href="https://github.com/cloudnative-pg/cloudnative-pg/pull/11733">#11733</a>
  type: Bug Fix
  impact: High

