product: Hybrid Manager operator
version: 2.3.0
# REVIEW: This is the date of the v2.3.0 tag, not the publication date. The
# published date is the date the operator is promoted to production in Lantern
# (https://lantern.edb.dev/release/foundation/container-releases), which had not
