product: Hybrid Manager operator
version: 2.3.0
# TODO: set to the date the operator is promoted to production in Lantern
# (https://lantern.edb.dev/release/foundation/container-releases), then delete this comment.
date: 3 November 2026
intro: |
  Version 2.3.0 takes the values for `spec.scenarios` from the Hybrid Manager (HM) version you install, so a scenario that a later HM version adds needs no operator upgrade. It also refuses to uninstall an installed scenario unless you confirm it, periodically recreates resources deleted outside the operator, and stops copying image pull secrets into every namespace in the cluster.
highlights: |
  - **The values `spec.scenarios` accepts now come from the HM version you install, not from the operator.** Each HM version defines its own scenarios, and the operator accepts the ones defined by the version in `spec.version`, so a scenario a later HM version adds needs no operator upgrade. If `spec.scenarios` contains a well-formed name that the target version doesn’t define, the operator now accepts it, drops it from the spec, and emits an event. Earlier versions rejected such names outright.

  - **The operator no longer copies image pull secrets to every namespace in the cluster.** It stops adding `replicator.v1.mittwald.de/replicate-to: "*"` to the secrets named in `spec.registry.imagePullSecrets`, so a secret reaches only the namespaces its own replicator annotations name. `edbctl` 1.11 or later annotates the pull secret it creates for the namespaces that need it. A secret created with an earlier `edbctl` keeps the `"*"` annotation that `edbctl` set and is still copied everywhere. If you create the secret by hand, annotate it yourself, or workloads outside its namespace can't pull their images.

  - **Removing an installed scenario from `spec.scenarios` is refused unless you confirm it with an annotation.** Re-applying a manifest that lists fewer scenarios than are installed now fails at admission instead of uninstalling those components and losing the data they hold. Pipelines that re-apply a trimmed manifest need the confirmation annotation.

  - **Resources deleted outside the operator are recreated automatically.** The operator periodically redeploys an installation that has finished installing or upgrading. It recreates only missing resources and doesn't revert a resource you edited. As before, an edited resource is overwritten the next time its component is deployed, for example during an HM upgrade or when you change its parameters.
relnotes:
- relnote: |
    The scenario names `spec.scenarios` accepts come from the target Hybrid Manager version
  details: |
    The names you can list in `spec.scenarios` are the ones the Hybrid Manager version in `spec.version` defines, rather than a fixed list built into the operator. A name made of lowercase letters, digits, and `-`, up to 63 characters, is accepted even when the target version doesn't define it; the operator then removes it from `spec.scenarios` and records a `ScenariosDropped` event. So when an HM version retires a scenario, that version stops installing and reporting it, while earlier versions keep it. A name that isn't well formed, such as the legacy `monitoringLogging`, is still removed automatically when you apply the manifest, so a manifest carrying one keeps applying as before. Upgrading the operator leaves an existing `spec.scenarios` as it is, and `core` is still always installed.
  jira: UPM-140391
  addresses:
  type: Change
  impact: Highest

- relnote: |
    Removing an installed scenario has to be confirmed
  details: |
    An update that drops a scenario the installation is running from `spec.scenarios` is rejected, because applying it uninstalls that scenario's components along with the data they hold. The error names the command that confirms the removal — `kubectl annotate hybridcontrolplanes.edbpgai.edb.com edbpgai edbpgai.edb.com/confirm-scenario-removal=<names> --overwrite` — after which you repeat your change; the operator clears the annotation once the new set of scenarios is installed, so a confirmation doesn't carry over to a later edit. A scenario that another listed scenario depends on isn't treated as removed, because the operator adds it back. If the change reaches the operator without going through this check, the operator still doesn't uninstall anything: it sets the `ScenarioRemovalBlocked` condition and records a warning event with the same instruction.
  jira: UPM-140679
  addresses:
  type: Change
  impact: High

- relnote: |
    The operator no longer replicates image pull secrets to every namespace
  details: |
    **Action required for a pull secret you create by hand.** The operator no longer stamps `replicator.v1.mittwald.de/replicate-to: "*"` on the secrets named in `spec.registry.imagePullSecrets` (or the deprecated `spec.imagePullSecrets`), which copied the registry credentials into every namespace in the cluster, project namespaces included. Distributing the secret is now left to whatever created it: `edbctl` 1.11 or later annotates the pull secret it creates with the namespaces that pull with it, while a secret created with `edbctl` 1.10 or earlier already carries `replicate-to: "*"`, set by `edbctl` itself, and is still copied to every namespace. If you create the secret by hand, annotate it with `replicator.v1.mittwald.de/replicate-to` or `replicator.v1.mittwald.de/replicate-to-matching` for those namespaces yourself. Upgrading the operator doesn't remove an annotation an earlier version added, so the pull secret of an existing installation keeps being copied as before. The operator logs a message naming the secret when it finds no replicator annotation on it, and still reports an error when a configured pull secret doesn't exist at all.
  jira: UPM-139591
  addresses:
  type: Change
  impact: High

- relnote: |
    Resources deleted outside the operator are recreated automatically
  details: |
    The operator now periodically redeploys an installation that has finished installing or upgrading, so that any resource of a component that was deleted outside the operator is recreated. Previously, a resource deleted by hand stayed missing indefinitely. This pass only recreates missing resources and doesn't revert a resource you edited; as before, an edited resource is overwritten the next time its component is deployed, for example during an HM upgrade or when you change its parameters. The operator records a `Drifted` warning event naming the component whose resources it recreated, or a `DriftCheckFailed` warning when the redeploy couldn't run.
  jira: UPM-139323
  addresses:
  type: Feature
  impact: High

- relnote: |
    One `HybridControlPlane` per cluster, named `edbpgai`
  details: |
    Creating a `HybridControlPlane` under any name other than `edbpgai`, or creating a second one in a cluster that already holds one, is rejected at admission. Hybrid Manager's components and `edbctl` address the installation by that name, and a second `HybridControlPlane` stops the operator from managing either of them. The rule is enforced on create only, so an existing installation under another name keeps working: every update to it returns a warning, the operator records a `NonStandardName` warning event, and reinstalling as `edbpgai` is what clears it.
  jira: UPM-136810
  addresses:
  type: Change
  impact: High

- relnote: |
    The installed scenarios are reported in `status.scenarios`
  details: |
    `status.scenarios` records the scenarios for the Hybrid Manager version the operator last installed or upgraded to: that `version`, the scenario names it `defined`, the `dependencies` between them, and the `installed` set. Read it with `kubectl get hybridcontrolplane edbpgai -o yaml` to see which scenarios are installed and which names the target version knows, instead of inferring both from `spec.scenarios`.
  jira: UPM-140291
  addresses:
  type: Feature
  impact: Medium

- relnote: |
    Tunable CPU and memory for the automated upgrade jobs
  details: |
    You can now size the container of the jobs the operator runs during an HM upgrade with the `upgrade_job_cpu_request`, `upgrade_job_cpu_limit`, `upgrade_job_memory_request`, and `upgrade_job_memory_limit` global parameters. They default to `50m` and `1` for CPU and to `128Mi` and `1Gi` for memory, and when you set one half of a pair past the other's default, that default follows it — a request above the default limit raises the limit, a limit below the default request lowers the request. A value that isn't a Kubernetes quantity greater than zero, or a request above the limit you set for it, is rejected at admission.
  jira: UPM-140682
  addresses:
  type: Enhancement
  impact: Medium

- relnote: |
    An initial installation fails preflight when its object storage folder isn't empty
  details: |
    A first installation whose `spec.globalParameters.internal_backup_folder` already holds objects — anything an earlier Hybrid Manager left in the bucket, not just its database backups — is now refused by preflight instead of installing on top of them. `kubectl get preflight -o yaml` reports it under `status.initializationChecks`, naming the folder and how many objects are in it. Empty the folder, or set `internal_backup_folder` to an unused 12-character value, as a new installation requires.
  jira: UPM-140331
  addresses:
  type: Change
  impact: Medium

- relnote: |
    The `edb-object-storage` secret can live in `edb-system`
  details: |
    The operator reads the default object storage credentials from the `edb-object-storage` secret in either the `default` or the `edb-system` namespace, instead of `default` alone, so an installation that keeps platform secrets out of `default` can hold it with the rest of them. Keep exactly one copy: preflight reports the default object storage as `Invalid` when the secret exists in both namespaces.
  jira: UPM-139589
  addresses:
  type: Enhancement
  impact: Medium

- relnote: |
    The operator could crash while installing or upgrading a component
  details: |
    Fixed a bug where the operator could crash in the middle of an installation or upgrade while logging the deploy output of a component that changes many kinds of resources at once. That output is now logged intact and attributed to the right component.
  jira: UPM-139352
  addresses:
  type: Bug Fix
  impact: Medium

- relnote: |
    A component could keep reporting an old version
  details: |
    Fixed a bug where `status.components[].version` was updated only when a component's content or state changed, so a component that a new Hybrid Manager version ships unchanged went on reporting the version it was first installed at. The status now records the version a component was last deployed at, which is what `edbctl hybrid-manager status` and `kubectl describe hybridcontrolplane` show.
  jira: UPM-139919
  addresses:
  type: Bug Fix
  impact: Medium

- relnote: |
    Repeated errors in the operator log after a custom resource definition was removed
  details: |
    Fixed a bug where, after a custom resource definition the operator watches was removed — uninstalling Hybrid Manager removes SPIRE's, for example — the operator logged the same error with a stack trace over and over until it was restarted. It now logs this once at info level, and again only if the definition comes back.
  jira: UPM-139353
  addresses:
  type: Bug Fix
  impact: Low

- relnote: |
    A suspended component is left untouched
  details: |
    A component suspended with `edbctl hybrid-manager suspend-component` is now left alone entirely until you resume it, and its entry in `status.components[]` stays as it was. Resuming it with `edbctl hybrid-manager resume-component` deploys it as before.
  jira: UPM-140207
  addresses:
  type: Bug Fix
  impact: Low

- relnote: |
    `beacon_server_replicas` is validated
  details: |
    The `beacon_server_replicas` parameter of the `upm-beacon` component must be `0` or `1` where it is set, because that component supports a single replica only. An update that changes it to anything else is rejected, while an installation that already carries another value and leaves it alone gets a warning instead and keeps working.
  jira: UPM-140576
  addresses:
  type: Change
  impact: Low
