product: Hybrid Manager operator
shortname: hm-operator
title: Hybrid Manager operator release notes
description: Release notes for the EDB Hybrid Manager (HM) operator.
intro: |
  The Hybrid Manager (HM) operator is released independently of Hybrid Manager itself. These release notes describe what changed in each operator release.

  A single `2.x` operator supports a range of HM versions. To find the operator version that goes with the HM release you're running or upgrading to, see the [compatibility matrix](../compatibility_matrix).
outro: |
  !!! Note Releases before 2.0.0
      Before 2.0.0 the operator was versioned and released together with Hybrid Manager. Changes to those earlier versions are described in the [Hybrid Manager release notes](/edb-postgres-ai/latest/hybrid-manager/release_notes/).
