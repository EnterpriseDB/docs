<svg viewBox="0 0 790 301" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Inter','Segoe UI',sans-serif">
  <title>Anatomy of a commit scope</title>
  <desc>A labeled breakdown of bdr.create_commit_scope() showing scope name, which group, who confirms, the optional confirmation level, and how.</desc>

  <rect width="790" height="301" rx="8" fill="#ffffff"/>

  <!-- Code block background -->
  <rect x="20" y="36" width="482" height="170" rx="6" fill="#F4F8F9"/>

  <!-- Line 1 -->
  <text x="36" y="60" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#555">SELECT bdr.create_commit_scope(</text>

  <!-- Line 2: commit_scope_name -->
  <text x="52" y="84" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11">
    <tspan fill="#555">commit_scope_name := </tspan><tspan fill="#888">'my_scope'</tspan><tspan fill="#555">,</tspan>
  </text>

  <!-- Line 3: origin_node_group -->
  <text x="52" y="108" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11">
    <tspan fill="#555">origin_node_group := </tspan><tspan fill="#136A7F">'my_group'</tspan><tspan fill="#555">,</tspan>
  </text>

  <!-- Line 4: rule -->
  <text x="52" y="132" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11">
    <tspan fill="#555">rule := '</tspan><tspan fill="#429D9E">MAJORITY ORIGIN GROUP</tspan><tspan fill="#C26A1E"> ON durable</tspan><tspan fill="#F89E5D"> SYNCHRONOUS COMMIT</tspan><tspan fill="#555">',</tspan>
  </text>

  <!-- Line 5: wait_for_ready -->
  <text x="52" y="156" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#555">    wait_for_ready := true</text>

  <!-- Line 6: ); -->
  <text x="36" y="180" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#555">);</text>

  <!-- Callout boxes -->

  <!-- Box 1: scope name (neutral) -->
  <rect x="522" y="36" width="250" height="40" rx="6" fill="#F4F8F9" stroke="#888" stroke-width="1.5"/>
  <text x="534" y="52" font-size="11" font-weight="600" fill="#888">Scope name</text>
  <text x="534" y="67" font-size="10" fill="#555">commit_scope_name</text>

  <!-- Box 2: which group? (dark teal) -->
  <rect x="522" y="88" width="250" height="40" rx="6" fill="#F4F8F9" stroke="#136A7F" stroke-width="1.5"/>
  <text x="534" y="104" font-size="11" font-weight="600" fill="#136A7F">Which group?</text>
  <text x="534" y="119" font-size="10" fill="#555">origin_node_group</text>

  <!-- Box 3: who confirms? (mid teal) -->
  <rect x="522" y="140" width="250" height="40" rx="6" fill="#F4F8F9" stroke="#429D9E" stroke-width="1.5"/>
  <text x="534" y="156" font-size="11" font-weight="600" fill="#429D9E">Who confirms?</text>
  <text x="534" y="171" font-size="10" fill="#555">commit scope group specifier</text>

  <!-- Box 4: how far? (optional, dark amber, dashed) -->
  <rect x="522" y="192" width="250" height="40" rx="6" fill="#FFF4EA" stroke="#C26A1E" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="534" y="208" font-size="11" font-weight="600" fill="#C26A1E">How far? (optional)</text>
  <text x="534" y="223" font-size="10" fill="#555">Confirmation level</text>

  <!-- Box 5: how? (amber) -->
  <rect x="522" y="244" width="250" height="40" rx="6" fill="#F4F8F9" stroke="#F89E5D" stroke-width="1.5"/>
  <text x="534" y="260" font-size="11" font-weight="600" fill="#F89E5D">How?</text>
  <text x="534" y="275" font-size="10" fill="#555">Commit kind</text>

</svg>
