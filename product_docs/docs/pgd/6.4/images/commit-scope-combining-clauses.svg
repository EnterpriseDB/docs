<svg viewBox="0 0 660 100" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Inter','Segoe UI',sans-serif">
  <title>Combining clauses: each clause has its own group or groups, confirming nodes, and commit kind, joined by AND</title>
  <desc>Two clauses in parentheses joined by AND. Each clause contains which group or groups, who confirms, and how.</desc>

  <rect width="660" height="100" rx="10" fill="#F6F9FA"/>

  <text x="20" y="50" text-anchor="middle" dominant-baseline="central" font-size="36" fill="#9BBFC6" font-weight="200">(</text>
  <rect x="34" y="24" width="76" height="52" rx="7" fill="#136A7F"/>
  <text x="72" y="44" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#ffffff">which</text>
  <text x="72" y="57" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#ffffff">group(s)?</text>
  <text x="120" y="50" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#C8D8DC">+</text>
  <rect x="130" y="24" width="76" height="52" rx="7" fill="#429D9E"/>
  <text x="168" y="44" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#ffffff">who</text>
  <text x="168" y="57" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#ffffff">confirms?</text>
  <text x="216" y="50" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#C8D8DC">+</text>
  <rect x="226" y="24" width="56" height="52" rx="7" fill="#F89E5D"/>
  <text x="254" y="50" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#ffffff">how?</text>
  <text x="294" y="50" text-anchor="middle" dominant-baseline="central" font-size="36" fill="#9BBFC6" font-weight="200">)</text>

  <rect x="312" y="38" width="36" height="24" rx="5" fill="#555555"/>
  <text x="330" y="50" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#ffffff">AND</text>

  <text x="368" y="50" text-anchor="middle" dominant-baseline="central" font-size="36" fill="#9BBFC6" font-weight="200">(</text>
  <rect x="382" y="24" width="76" height="52" rx="7" fill="#136A7F"/>
  <text x="420" y="44" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#ffffff">which</text>
  <text x="420" y="57" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#ffffff">group(s)?</text>
  <text x="468" y="50" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#C8D8DC">+</text>
  <rect x="478" y="24" width="76" height="52" rx="7" fill="#429D9E"/>
  <text x="516" y="44" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#ffffff">who</text>
  <text x="516" y="57" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#ffffff">confirms?</text>
  <text x="564" y="50" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#C8D8DC">+</text>
  <rect x="574" y="24" width="56" height="52" rx="7" fill="#F89E5D"/>
  <text x="602" y="50" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#ffffff">how?</text>
  <text x="642" y="50" text-anchor="middle" dominant-baseline="central" font-size="36" fill="#9BBFC6" font-weight="200">)</text>

</svg>
