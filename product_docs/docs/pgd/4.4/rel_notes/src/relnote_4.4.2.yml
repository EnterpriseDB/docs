# yaml-language-server: $schema=https://raw.githubusercontent.com/EnterpriseDB/docs/refs/heads/develop/tools/automation/generators/relgen/relnote-schema.json
product: EDB Postgres Distributed
version: 4.4.2
date: 19 November 2026
components:
  "BDR": 4.4.2
  "HARP": 2.4.2
  "CLI": 1.1.2
  "TPAexec": "[23.36.0](/tpa/latest/rel_notes/tpa_23.36.0_rel_notes)"
  "Utilities": 4.3.7
intro: |
  PGD 4.4.2 is a minor release of PGD 4 for customers on an Extended Life Support contract. The release includes a number of bug fixes.
relnotes:
- relnote: Fixed a walsender crash during a configuration reload.
  details: |
      The walsender process crashed with a segmentation fault when it reloaded its configuration from `pgl_wait_for_standby_confirmation()`. PGD now overrides the pglogical GUCs only when it runs in a pglogical worker.
  component: BDR
  jira: BDR-5661
  addresses: "42100"
  type: Bug Fix
  impact: High
- relnote: Fixed `bdr.replication_set_remove_table()` crashing when the node isn't part of a node group.
  details: |
      The function dereferenced the node's node group without checking for `NULL`, crashing the backend when called before the node had joined a node group, such as during Autopartition's early setup. It now reports a clear error instead of crashing.
  component: BDR
  jira: BDR-8883
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed `bdr.alter_sequence_set_kind` ignoring start values for `galloc` sequences.
  details: |
      Changing a sequence kind to `galloc` silently discarded the provided `start_value`. Also fixed a bug where a `startval` of `0` was lost during WAL replication.
  component: BDR
  jira: BDR-7725
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed stale `galloc` sequence allocation entries after `DROP` and `CREATE`.
  details: |
      `sequence_alloc` entries persisted after a `galloc` sequence was dropped and recreated. The fix ensures the cleanup propagates across the cluster, including witness nodes.
  component: BDR
  jira: BDR-7711
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed a walsender crash loop caused by an interrupted partition detach.
  details: |
      Logical replication entered an infinite crash loop if a `DETACH PARTITION CONCURRENTLY` command was interrupted. The walsender failed with the error `relation has no parent because it's being detached` when it decoded WAL for a partition with `inhdetachpending = true`.
  component: BDR
  jira: BDR-7245
  addresses: 53628, 59291
  type: Bug Fix
  impact: High
- relnote: Fixed a segmentation fault during `COPY` commands when `pgaudit.role` is set to a non-default value.
  details: |
      Postgres crashed with a segmentation fault when running a `COPY` command while the `pgaudit.role` configuration was set to a non-default value.
  component: BDR
  jira: BDR-7701
  addresses: "58060"
  type: Bug Fix
  impact: Medium
- relnote: Fixed a potential crash in the local node lookup.
  details: |
    An internal lookup of the local node could crash the backend instead of returning cleanly when the database had the BDR extension installed but no local node, for example before [`bdr.create_node()`](/pgd/4.4/bdr/nodes/#bdrcreate_node) or after the node was parted. No known user operation reached this code path. The lookup is now safe for such callers.
  component: BDR
  jira: BDR-8536
  addresses: ""
  type: Bug Fix
  impact: Low
