product: EDB Postgres Distributed
version: 5.9.5
date: 20 August 2026
components:
  "BDR": 5.9.5
  "PGD CLI": 5.9.5
  "PGD Proxy": 5.9.5
  "Utilities": 5.9.5
intro: |
  EDB Postgres Distributed (PGD) 5.9.5 includes only bug fixes focused on improving stability and reliability. For a list of known issues, see [Known issues](/pgd/current/known_issues/).

relnotes:
- relnote: Fixed node-join failure caused by an under-sized replication origin estimate during catch-up.
  details: |
    The function [`bdr.get_min_required_replication_slots()`](/pgd/5.9/reference/functions-internal/#bdrget_min_required_replication_slots) previously ignored the temporary catch-up subscription active during a node join, so joining a cluster sized to the reported minimum exhausted `max_replication_slots` and failed. The estimate now accounts for the catch-up subscription, and a new `bdr.get_min_required_active_replication_origins()` function returns the matching estimate for PostgreSQL 18's separate `max_active_replication_origins` limit.
  jira: BDR-8135
  component: BDR
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed a crash caused by a race between a joining and a parting node.
  details: |
    A joining node sometimes reached the `PART_CATCHUP` phase of a concurrent node part before it had created a replication origin for the parting node, crashing the manager or writer process when it tried to access the missing origin. PGD now creates the origin in this case, and removes it automatically once the parting node reaches the `PARTED` state.
  jira: BDR-8143
  component: BDR
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed a crash on dynamic partition creation for `HASH` and `LIST` subpartitions.
  details: |
    Creating a dynamic interval partition with `HASH` or `LIST` subpartitions crashed the originating node, and once fixed, produced duplicate partition names that looped until the server ran out of memory. The partition-naming hook is now strategy-aware, producing a unique, deterministic name for each partition across all nodes.
  jira: BDR-7438, BDR-8200
  component: BDR
  addresses: "61769"
  type: Bug Fix
  impact: High
- relnote: Fixed resource leaks in `bdr.ri_fkey_on_del_trigger`.
  details: |
    The `bdr.ri_fkey_on_del_trigger` trigger function left a relation, a tuple descriptor, and a snapshot open every time it ran, logging `resource was not closed` warnings on every node. The function now closes these resources correctly.
  jira: BDR-8257
  component: BDR
  addresses: ""
  type: Bug Fix
  impact: Low
- relnote: Fixed `ALTER PROFILE` replication failure on witness nodes when a password verify function is set.
  details: |
    On EDB Postgres Advanced Server (EPAS), witness nodes don't replicate non-role database objects, so replicating `ALTER PROFILE` with a `PASSWORD_VERIFY_FUNCTION` failed on witness nodes with a `function does not exist` error. PGD now skips executing the function on witness nodes, since it already ran on the originating node.
  jira: BDR-8125
  component: BDR
  addresses: "61289"
  type: Bug Fix
  impact: Medium
- relnote: Fixed PGD Proxy packages not upgrading to 5.9.5.
  details: |
    The 5.9.5 PGD Proxy package had a lower epoch than 5.9.4, so package managers treated it as older and skipped the upgrade. The epoch is now set correctly.
  jira: BDR-8433
  component: PGD Proxy
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Updated PGD Proxy Go dependencies to address known vulnerabilities.
  details: |
    Updated `golang.org/x/crypto`, `github.com/jackc/pgx/v5`, and related transitive dependencies to their latest patch versions to resolve known CVEs.
  jira: BDR-8164
  component: PGD Proxy
  addresses: ""
  type: Security
  impact: Medium
- relnote: Protect against creating a Default partition on an autopartitioned table.
  details: |
    Autopartition doesn't support a Default partition. DDL that attempted to create one on an autopartitioned table is now rejected instead of leaving the table in an inconsistent state.
  jira: BDR-8126
  component: BDR
  addresses: "61462"
  type: Bug Fix
  impact: Medium
- relnote: Fixed `bdr.switch_node_group` incorrectly succeeding in a mixed-version cluster during a rolling upgrade.
  details: |
    `bdr.switch_node_group` was previously allowed even when the cluster hadn't yet reached the required Raft protocol version during a rolling upgrade. It's now permitted only after the cluster reaches the required protocol version, with a clear error otherwise.
  jira: BDR-8539
  component: BDR
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed `pgd replication show` erroring out on a subscription with a NULL LSN.
  details: |
    `pgd replication show` failed instead of reporting a subscription that hasn't made progress and has a NULL LSN. The command now reports these no-progress subscriptions without erroring out.
  jira: BDR-8476
  component: PGD CLI
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed commit decisions never being cleaned up for certain workloads after repeated timeouts.
  details: |
    Under certain workloads, the commit-decision store's maintenance pass could time out repeatedly without ever fully cataloging its backlog, leaving some commit decisions uncleaned. Maintenance now performs a final no-timeout cleanup pass after multiple timeouts, ensuring all commit decisions are eventually cleaned up.
  jira: BDR-8284
  component: BDR
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed routing getting stuck in an infinite loop after a major network outage.
  details: |
    A major network outage that disconnected and reconnected multiple nodes could leave routing stuck in an infinite loop, repeatedly logging `Routing stuck in infinite loop` warnings about a node group's routing record version, with no write leader elected.
  jira: BDR-8486
  component: BDR
  addresses: "63103"
  type: Bug Fix
  impact: High
- relnote: Adopt recovered global locks lazily instead of reacquiring them at writer startup.
  details: |
    A writer that restarted while holding a global lock previously reacquired every lock left in recovery state and bound it to itself, sometimes leaving parallel apply disabled after the lock was released. Writers now adopt an existing recovered lock for the same origin node instead, which also supports locks that apply on any streaming writer.
  jira: BDR-7672
  component: BDR
  addresses: "58160"
  type: Bug Fix
  impact: High
- relnote: Fixed incorrect values reported by `bdr.stat_subscription` for pre-commit counters.
  details: |
    The `npre_commit` and `npre_commit_confirmations` columns of `bdr.stat_subscription`, and the underlying `bdr.get_subscription_stats()` function, had their values swapped. `npre_commit` always reported 0, or whatever value `npre_commit_confirmations` actually held, while `npre_commit_confirmations` reported the real pre-commit count. This was a reporting-only issue. Commit At Most Once (CAMO) and group commit replication behavior weren't affected, and only the statistics view was wrong.
  jira: ""
  component: BDR
  addresses: ""
  type: Bug Fix
  impact: Low
- relnote: Fixed `bdr.raft_vacuum_interval` and `bdr.raft_vacuum_full_interval` having no effect.
  details: |
    Since PGD 6.2, a hard-coded one-hour minimum interval silently overrode the `bdr.raft_vacuum_interval` and `bdr.raft_vacuum_full_interval` configuration parameters, added to prevent `VACUUM FULL` from causing consensus request timeouts during operations like node group creation. The override is now removed and the configuration parameters take effect as intended, while the original timeout issue remains fixed.
  jira: BDR-8590
  component: BDR
  addresses: ""
  type: Bug Fix
  impact: Medium
