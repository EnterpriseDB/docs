# yaml-language-server: $schema=https://raw.githubusercontent.com/EnterpriseDB/docs/refs/heads/develop/tools/automation/generators/relgen/relnote-schema.json
product: EDB Postgres Distributed
version: 6.5.0
date: 20 August 2026
intro: |
  EDB Postgres Distributed (PGD) 6.5.0 includes new features, enhancements, bug fixes, a change, and a deprecation.
highlights: |
  - [Multi-threaded, up to 2.4x faster Connection Manager](/pgd/current/connection-manager/overview/): runs on a multi-threaded engine that scales with CPU cores and processes routing updates off the traffic path, with new pooling modes yielding up to 60% further throughput gains.
  - [Built-in web UI for monitoring](/pgd/current/lifecycle/monitoring/pgd-monitor/web-ui/): every PGD node can optionally serve a monitoring web application covering cluster overview, connection management, replication, Raft, commit scopes, activity, query diagnostics, and error logs.
  - [Prometheus metrics endpoint](/pgd/current/lifecycle/monitoring/pgd-monitor/prometheus/): the PGD monitor can expose a `/metrics` endpoint alongside the web UI and REST API, with PGD-native and optional Postgres statistics metric families.
  - [Automatic node eviction](/pgd/current/reference/cli/command_ref/group/set-option/): the new `evict_node_action` and `evict_node_lag_bytes` group options automatically part a node once its replication lag exceeds a configured threshold, preventing WAL-accumulation outages.

relnotes:
- relnote: Quorum Commit now works with any transaction streaming mode.
  details: |
    Quorum Commit previously required [`bdr.default_streaming_mode`](/pgd/current/commit-scopes/quorum-commit/using-quorum-commit/#compatibility) set to `file` or `off`. PGD now detects Quorum Commit transactions at the origin and streams them to file automatically, so all streaming modes work without special configuration. During a rolling upgrade, keep `bdr.default_streaming_mode` set to `file` or `off` until every node is on PGD 6.5 or later.
  jira: BDR-8158
  addresses: ""
  type: Enhancement
  impact: Medium
- relnote: CLI node setup no longer defaults to unwrapped TDE keys.
  details: |
    Node setup on a TDE-enabled cluster previously defaulted to `pg_resetwal` with no-wrap settings when no key wrap or unwrap command was specified, causing Postgres to fail to start later with a decryption error. The CLI now requires an explicit [`--no-key-wrap`](/pgd/current/reference/cli/command_ref/node/setup/#support-for-transparent-data-encryption-tde) flag to skip key wrapping, and fails immediately with a clear error otherwise.
  jira: BDR-7888
  addresses: "59715"
  type: Enhancement
  impact: Medium
- relnote: Added `leader_id` and `voted_for_id` columns to `bdr.stat_raft_state`, and `node_id` to `bdr.stat_raft_followers_state`.
  details: |
    The Raft status views previously exposed only node names, not their numeric IDs. [`bdr.stat_raft_state`](/pgd/current/reference/tables-views-functions/catalogs-visible/#bdrstat_raft_state) now includes `leader_id` alongside `leader_name`, and `voted_for_id` alongside `voted_for_name`. [`bdr.stat_raft_followers_state`](/pgd/current/reference/tables-views-functions/catalogs-visible/#bdrstat_raft_followers_state) now includes `node_id` alongside `node_name`.
  jira: BDR-6677
  addresses: ""
  type: Enhancement
  impact: Low
- relnote: Added `peer_applied_state_name` to `bdr.node_summary`.
  details: |
    The view [`bdr.node_summary`](/pgd/current/reference/tables-views-functions/catalogs-visible/#bdrnode_summary) now includes the node's local applied state, making it easier to spot cases where a node's Raft-managed state has advanced but its subscriptions haven't caught up.
  jira: BDR-2606
  addresses: "82977"
  type: Enhancement
  impact: Low
- relnote: Improved error code assignment for user-actionable errors.
  details: |
    Errors that previously defaulted to `ERRCODE_INTERNAL_ERROR` now report a more specific `SQLSTATE` where applicable, making it easier for applications and administrators to distinguish user-actionable errors from internal ones.
  jira: BDR-1712
  addresses: ""
  type: Enhancement
  impact: Low
- relnote: Improved CLI error messages when BDR extension isn't installed.
  details: |
    The [`pgd` CLI](/pgd/current/reference/cli/using_cli/) now gives a clearer error when it detects that the target Postgres instance doesn't have the BDR extension installed, rather than a generic connection error.
  jira: BDR-6983
  addresses: ""
  type: Enhancement
  impact: Low
- relnote: Fixed node-join failure caused by an under-sized replication origin estimate during catch-up.
  details: |
    The function [`bdr.get_min_required_replication_slots()`](/pgd/current/reference/tables-views-functions/functions-internal/#bdrget_min_required_replication_slots) previously ignored the temporary catch-up subscription active during a node join, so joining a cluster sized to the reported minimum exhausted `max_replication_slots` and failed. The estimate now accounts for the catch-up subscription, and a new [`bdr.get_min_required_active_replication_origins()`](/pgd/current/reference/tables-views-functions/functions-internal/#bdrget_min_required_active_replication_origins) function returns the matching estimate for Postgres 18's separate `max_active_replication_origins` limit.
  jira: BDR-8135
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed a crash caused by a race between a joining and a parting node.
  details: |
    A joining node sometimes reached the `PART_CATCHUP` phase of a concurrent node part before it had created a replication origin for the parting node, crashing the manager or writer process when it tried to access the missing origin. PGD now creates the origin in this case, and removes it automatically once the parting node reaches the `PARTED` state.
  jira: BDR-8143
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed an internal lock leak on error while recording a Quorum Commit decision.
  details: |
    An error recording a Quorum Commit decision, after `PREPARE` detached the transaction, leaked an internal commit-decision lock and blocked other processes indefinitely. PGD now releases the lock on any error during the commit of a Quorum Commit transaction.
  jira: BDR-8183
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed a possible commit/abort divergence on error while recording a Quorum Commit decision.
  details: |
    An error while recording a Quorum Commit decision sometimes committed the transaction on the origin prematurely, before the decision was durably recorded elsewhere. PGD no longer commits the transaction early in this case.
  jira: ""
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed commit decisions being dropped during commit-decision store maintenance.
  details: |
    When the commit-decision store had a large backlog to catalog, a maintenance pass that hit its time limit paused and resumed later. One commit decision was skipped at each pause and resume boundary, leaving it unavailable for transaction resolution. Cataloging now resumes from the correct position, so no decision is dropped.
  jira: BDR-8319
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed a Quorum Commit transaction hanging indefinitely when its origin node was parted mid-commit.
  details: |
    A Quorum Commit transaction's client connection hung indefinitely when the originating node was parted from the cluster while the transaction's final commit or abort decision was still propagating to the rest of the cluster. The transaction now completes promptly and returns a clear error.
  jira: BDR-8331
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed a performance regression affecting Commit At Most Once (CAMO) transactions introduced in 6.3.0 and 6.3.1.
  details: |
    CAMO transactions experienced elevated commit latency and reduced throughput compared with earlier releases. The regression is now fixed, and the improvement applies automatically after upgrade.
  jira: BDR-8309
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed a crash on dynamic partition creation for `HASH` and `LIST` subpartitions.
  details: |
    Creating a dynamic interval partition with `HASH` or `LIST` subpartitions crashed the originating node, and once fixed, produced duplicate partition names that looped until the server ran out of memory. The partition-naming hook is now strategy-aware, producing a unique, deterministic name for each partition across all nodes.
  jira: BDR-7438, BDR-8200
  addresses: "61769"
  type: Bug Fix
  impact: High
- relnote: Adopt recovered global locks lazily instead of reacquiring them at writer startup.
  details: |
    A writer that restarted while holding a global lock previously reacquired every lock left in recovery state and bound it to itself, sometimes leaving parallel apply disabled after the lock was released. Writers now adopt an existing recovered lock for the same origin node instead, which also supports locks that apply on any streaming writer.
  jira: BDR-7672
  addresses: "58160"
  type: Bug Fix
  impact: High
- relnote: Fixed physical join failing when Postgres restarts on the joining node mid-join.
  details: |
    In some cases, a Postgres restart on the joining node during a physical join caused the join to attempt a logical sync, resulting in errors. The fix prevents the physical join from falling back to logical join logic when a restart occurs mid-join.
  jira: BDR-8013
  addresses: "59904"
  type: Bug Fix
  impact: Low
- relnote: Fixed resource leaks in `bdr.ri_fkey_on_del_trigger`.
  details: |
    The `bdr.ri_fkey_on_del_trigger` trigger function left a relation, a tuple descriptor, and a snapshot open every time it ran, logging `resource was not closed` warnings on every node. The function now closes these resources correctly.
  jira: BDR-8257
  addresses: ""
  type: Bug Fix
  impact: Low
- relnote: Fixed `ALTER PROFILE` replication failure on witness nodes when a password verify function is set.
  details: |
    On EDB Postgres Advanced Server (EPAS), witness nodes don't replicate non-role database objects, so replicating `ALTER PROFILE` with a `PASSWORD_VERIFY_FUNCTION` failed on witness nodes with a `function does not exist` error. PGD now skips executing the function on witness nodes, since it already ran on the originating node.
  jira: BDR-8125
  addresses: "61289"
  type: Bug Fix
  impact: Medium
- relnote: Added the `pgd raft restore` command to restore Raft consensus.
  details: |
    [The command](/pgd/current/reference/cli/command_ref/raft/restore/) identifies the minimum set of nodes to remove to restore consensus, prioritizing witness nodes, and removes them after confirmation.
  jira: BDR-7747
  addresses: ""
  type: Feature
  impact: Medium
- relnote: "`pgd node upgrade` now automates the pre-upgrade steps."
  details: |
    [The command](/pgd/current/reference/cli/command_ref/node/upgrade/#modes-of-operation) previously required you to complete several manual pre-upgrade steps before running it. It now performs these steps automatically, removing manual preparation from the upgrade process.
  jira: BDR-6692
  addresses: ""
  type: Enhancement
  impact: Medium
- relnote: Added `pgd node start`, `stop`, and `restart` commands to manage the local Postgres instance.
  details: |
    These commands [start](/pgd/current/reference/cli/command_ref/node/start/), [stop](/pgd/current/reference/cli/command_ref/node/stop/), or [restart](/pgd/current/reference/cli/command_ref/node/restart/) the Postgres instance on the local node without requiring systemd.
  jira: BDR-6682
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Added `leader_id` and `voted_for_id` to the `pgd raft show` command.
  details: |
    The [`pgd raft show`](/pgd/current/reference/cli/command_ref/raft/show/) command now displays the `leader_id` and `voted_for_id` fields when querying a PGD 6.5 or later cluster, matching the fields added to `bdr.stat_raft_state`.
  jira: BDR-8226
  addresses: ""
  type: Enhancement
  impact: Low
- relnote: "`pgd node upgrade` now prints a closing summary after a successful upgrade."
  details: |
    [The command](/pgd/current/reference/cli/command_ref/node/upgrade/) previously ended abruptly after stopping the new Postgres instance, leaving operators unsure whether the upgrade had finished. It now prints a summary confirming success along with the next steps to start the new instance.
  jira: BDR-8252
  addresses: ""
  type: Enhancement
  impact: Low
- relnote: Fixed `pgd node setup` losing its initialization state after a restart.
  details: |
    An accidental Postgres restart during setup could lose the recorded initialization state and trigger an unintended logical join. `pgd node setup` now persists this state, and checks both the node state and the applied state during setup.
  jira: BDR-8130
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed `pgd node setup` duplicating configuration entries on repeated runs.
  details: |
    Running `pgd node setup` more than once appended duplicate entries to `postgresql.conf` and `pg_hba.conf` on each run. The command now checks for existing entries and skips them if already present.
  jira: BDR-6694
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Improved CLI error handling to avoid panics.
  details: |
    The CLI previously failed with raw panics and generic errors that gave little context for troubleshooting. Error handling now provides clearer, more actionable messages throughout the CLI.
  jira: BDR-6690
  addresses: ""
  type: Enhancement
  impact: Medium
- relnote: Fixed `pgd node upgrade --prepare` failing when upgrading to Postgres 18 from a cluster without data checksums.
  details: |
    Postgres 18 changed the `initdb` default for data checksums from off to on. Upgrading a cluster that had checksums disabled to Postgres 18 or later failed with `old cluster does not use data checksums but the new one does`. `pgd node upgrade --prepare` now handles this version mismatch automatically.
  jira: BDR-8244
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed inconsistent `enable_raft`/`enable_routing` state on new sub-groups created during a rolling upgrade.
  details: |
    Creating a new sub-group during a rolling upgrade could leave its `enable_raft` and `enable_routing` settings inconsistent across nodes. PGD now defers enabling Raft and routing for new sub-groups until every node has completed the upgrade.
  jira: BDR-7097
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed `bdr.switch_node_group` incorrectly succeeding in a mixed-version cluster during a rolling upgrade.
  details: |
    `bdr.switch_node_group` was previously allowed even when the cluster hadn't yet reached the required Raft protocol version during a rolling upgrade. It's now permitted only after the cluster reaches the required protocol version, with a clear error otherwise.
  jira: BDR-7097
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Protect against creating a Default partition on an autopartitioned table.
  details: |
    [Autopartition](/pgd/current/autopartition/) doesn't support a Default partition. DDL that attempted to create one on an autopartitioned table is now rejected instead of leaving the table in an inconsistent state.
  jira: BDR-8126
  addresses: "61462"
  type: Bug Fix
  impact: Medium
- relnote: Fixed an intermittent `replication slot does not exist` error from the PGD manager process.
  details: |
    Before the consensus protocol version was established, such as briefly after a node restart, the group slot name was generated using an outdated mechanism, producing an incorrect name and the `replication slot does not exist` error. The group slot name is now generated correctly regardless of consensus protocol state.
  jira: BDR-7420
  addresses: "59424"
  type: Bug Fix
  impact: Low
- relnote: Added validation when setting `analytics_storage_location`/`analytics_write_catalog`.
  details: |
    [`bdr.alter_node_group_option`](/pgd/current/reference/cli/command_ref/group/set-option/) now checks that the target is a valid read or write path when configuring these analytics options, rejecting the configuration otherwise.
  jira: BDR-6414
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Fixed nested systable scans in the logical decoding path causing an `unexpected table_scan_getnextslot call` error.
  details: |
    Nested `systable_beginscan` and `systable_endscan` calls in the logical decoding path reset a global variable, later triggering the error "unexpected table_scan_getnextslot call during logical decoding." The nested scans no longer interfere with each other.
  jira: BDR-7877
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed `pgd replication show` erroring out on a subscription with a NULL LSN.
  details: |
    `pgd replication show` failed instead of reporting a subscription that hasn't made progress and has a NULL LSN. The command now reports these no-progress subscriptions without erroring out.
  jira: BDR-8466
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed `pgd node setup` failing with `server did not start in time` during a large physical join.
  details: |
    `pgd node setup` previously waited on `pg_ctl`'s default startup timeout while the joining node replayed WAL from a large base backup, and could fail before the node was ready. The command now waits indefinitely by default unless `--timeout` or the `PGCTLTIMEOUT` environment variable is set, and a retry resumes from where a previous attempt left off instead of redoing the base backup.
  jira: BDR-8472
  addresses: "63142"
  type: Bug Fix
  impact: High
- relnote: Added automatic node eviction based on replication lag.
  details: |
    The new [`evict_node_action`](/pgd/current/reference/cli/command_ref/group/set-option/) and `evict_node_lag_bytes` group options, set through `bdr.alter_node_group_option()`, automatically part a node once its replication lag exceeds a configured threshold.
  jira: BDR-2028
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Added a built-in web UI and REST API for monitoring PGD clusters.
  details: |
    Every PGD node now serves a [monitoring web application](/pgd/current/lifecycle/monitoring/pgd-monitor/web-ui/) as a background worker, enabled with `bdr.monitor_enabled = on`. It covers cluster overview, connection management, replication, Raft, commit scopes, replication conflicts, activity, tables, query diagnostics, metrics, cluster events, and error log pages, backed by a JSON REST API under `/api/v1/`.
  jira: BDR-8191
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Added a Prometheus metrics endpoint to the PGD monitor.
  details: |
    The PGD monitor now exposes a [`/metrics` endpoint](/pgd/current/lifecycle/monitoring/pgd-monitor/prometheus/) in Prometheus text format alongside the web UI and REST API. It includes PGD-native timeseries and cluster-state metrics, and optionally Postgres statistics metric families, controlled by `bdr.monitor_prometheus_pg_metrics`.
  jira: BDR-8542
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Fixed routing getting stuck in an infinite loop after a major network outage.
  details: |
    A major network outage that disconnected and reconnected multiple nodes could leave routing stuck in an infinite loop, repeatedly logging `Routing stuck in infinite loop` warnings about a node group's routing record version, with no write leader elected.
  jira: BDR-8486
  addresses: "63103"
  type: Bug Fix
  impact: High
- relnote: Fixed the fast track writer not activating on a subgroup.
  details: |
    Quorum Commit requires a fast track writer enabled on the node group, which happens automatically when a Quorum Commit commit scope is associated with the group. This activation previously didn't take effect for a subgroup. The fast track writer now activates correctly for subgroups too.
  jira: BDR-8565
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Optimized pruning of Raft consensus log tables.
  details: |
    Pruning the Raft consensus catalogs (`bdr.global_consensus_journal`, `bdr.global_consensus_response_journal`, and `bdr.local_consensus_state`) previously ran slow index scans, and could contribute to a drop in transaction throughput under heavy Raft activity, such as with Quorum Commit workloads. Pruning now uses a proper lower-bound index scan, reducing the time each pruning pass takes.
  jira: BDR-8550
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Prevent unsafe `VACUUM FULL` or `CLUSTER` on TOAST tables.
  details: |
    Running `VACUUM FULL` or `CLUSTER` directly on a [TOAST table](/pgd/current/conflict-management/conflicts/02_types_of_conflict/#toast-support-details) without also running it on the parent table removed metadata needed for PGD's extra logging, leaving a window where PGD's protection against related concurrency issues wasn't active. PGD now rejects `VACUUM FULL` and `CLUSTER` on TOAST tables by default, unless [`bdr.permit_unsafe_commands`](/pgd/current/reference/tables-views-functions/pgd-settings/#bdrpermit_unsafe_commands) is enabled.
  jira: BDR-134
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed `bdr.raft_vacuum_interval` and `bdr.raft_vacuum_full_interval` having no effect.
  details: |
    Since PGD 6.2, a hard-coded one-hour minimum interval silently overrode the [`bdr.raft_vacuum_interval`](/pgd/current/reference/tables-views-functions/pgd-settings/#bdrraft_vacuum_interval) and [`bdr.raft_vacuum_full_interval`](/pgd/current/reference/tables-views-functions/pgd-settings/#bdrraft_vacuum_full_interval) configuration parameters, added to prevent `VACUUM FULL` from causing consensus request timeouts during operations like node group creation. The override is now removed and the configuration parameters take effect as intended, while the original timeout issue remains fixed.
  jira: BDR-8590
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed a write-leader failover bug that could promote a node that isn't the most caught-up node.
  details: |
    On a write-leader outage, the Raft leader could elect a node that wasn't the most caught-up node relative to the previous write leader, for example when the write leader crashed with no suitable candidate available, or when the Raft leader and write leader were the same node and crashed together, leaving the new Raft leader without leader-progress details and relying on stale replication-progress information relative to the configured `bdr.leader_progress_tracking_period`. Failover now selects the most caught-up node correctly in these cases.
  jira: BDR-8512
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed replication becoming permanently stalled due to a miscalculated apply delay in Quorum Commit and zero clock-skew configurations.
  details: |
    When a node rejoined the cluster or recovered from a restart, the first transaction relayed through the catch-up path sometimes had no commit timestamp yet. The clock-skew check misread this absence as a multi-day clock discrepancy and paused replication for an effectively indefinite duration instead of a few milliseconds, wedging the affected subscription until it was manually restarted. The stall could occur with a Quorum Commit commit scope, or with `bdr.maximum_clock_skew` set and its action configured to wait. The clock-skew check now recognizes when a timestamp isn't yet available and skips the check for that transaction, so replication proceeds normally through the rejoin or recovery window.
  jira: BDR-8661
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed misreporting of Connection Manager group options as inheritable.
  details: |
    Connection Manager group options, such as `read_write_port` and `read_only_port`, were reported as inheritable but didn't actually exhibit inheritance behavior, so a subgroup could show a setting as inherited from its parent group while running with a different, independently sourced value.
  jira: BDR-8526
  addresses: "63103"
  type: Bug Fix
  impact: High
- relnote: Connection Manager is now multi-threaded.
  details: |
    [Connection Manager](/pgd/current/connection-manager/overview/) previously handled all client traffic, pooling, and authentication on a single thread. It now runs on a multi-threaded engine, so connection capacity scales with the number of CPU cores. Configuration and routing updates are processed on a separate thread, off the traffic path.
  jira: BDR-8149
  addresses: ""
  type: Enhancement
  impact: High
- relnote: Improved Connection Manager performance.
  details: |
    Connection pooling and query forwarding are extensively optimized, delivering roughly 2.4 times higher throughput and lower per-query latency, especially under a high number of concurrent connections. New settings give finer control over pooling behavior. `bdr.conn_mgr_server_idle_timeout` controls how long idle server connections are kept, and [`bdr.conn_mgr_worker_threads`](/pgd/current/reference/tables-views-functions/pgd-settings/#bdrconn_mgr_worker_threads) sets the number of worker threads. The new [`conn_mgr_server_reset_mode`](/pgd/current/connection-manager/connection-pooling/#configuring-the-reset-mode) group option enables a PgBouncer-style fast mode for transaction pooling, increasing throughput up to 60% more for applications that don't rely on session state cleanup between transactions.
  jira: BDR-8560
  addresses: ""
  type: Enhancement
  impact: High
- relnote: PGD Essential (PGD-S) is no longer released as a separate package.
  details: |
    Starting with this release, EDB is sunsetting PGD Essential as a distinct package variant. There's no PGD Essential 6.5.0 build. Use standard PGD packages from the `postgres_distributed` repository instead, following the equivalent [deployment pattern](/pgd/current/planning/deployment-patterns/), such as a single data group or a primary active group with a DR group. Contact your EDB account manager if you need help migrating.
  jira: DOCS-4088
  addresses: ""
  type: Deprecation
  impact: High
- relnote: PGD 6.5.0 requires EDB Postgres Extended 18.6.0 or later.
  details: |
    PGD 6.0 through 6.4 aren't compatible with EDB Postgres Extended 18.6.0 or later and must stay on EDB Postgres Extended 18.1.0 through 18.5.x. If you're running Postgres 18, upgrade PGD and EDB Postgres Extended together to avoid landing on an unsupported combination. This doesn't affect Postgres or EDB Postgres Advanced Server, which follow the usual minimum minor versions. See [PGD compatibility](/pgd/current/overview/compatibility/) for the full compatibility matrix.
  jira: ""
  addresses: ""
  type: Change
  impact: High
- relnote: Fixed a transaction reconciliation bug that could cause data divergence when a node's abort decision wasn't handled correctly.
  details: |
    During reconciliation, if every node except the origin already had a transaction prepared, a node's decision to abort that transaction wasn't always handled correctly. Some nodes could then abort the prepared transaction while others committed it, diverging their data.
  jira: BDR-8685
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Nodes now wait to catch up on transactions from the previous write leader before accepting Quorum Commit transactions from a new one.
  details: |
    Without this wait, consistency was already guaranteed for inserts and updates across a write leader change. Waiting for nodes to catch up first extends that guarantee to deletes, unique key updates, reinserting previously deleted or changed unique keys, and all DDL and DML commands.
  jira: BDR-8478
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Reduced logging verbosity for some Quorum Commit messages that were logged as `WARNING`.
  details: |
    Messages such as `2PC: Received commit decision before prepare of committed remote xid ...` logged at `WARNING` level despite not indicating an actual problem, and could appear frequently with Quorum Commit transactions. These messages now log at a lower level.
  jira: ""
  addresses: ""
  type: Bug Fix
  impact: Low
- relnote: Fixed a data inconsistency bug that could cause transactions to be missed with Quorum Commit.
  details: |
    An aborted transaction could advance the origin on downstream nodes even when earlier transactions hadn't committed yet. If a crash occurred at that point, those earlier transactions, already committed on other nodes, could be skipped on this node.
  jira: BDR-8736
  addresses: ""
  type: Bug Fix
  impact: High
