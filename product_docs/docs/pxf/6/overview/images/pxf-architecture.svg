<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Inter','Segoe UI',sans-serif">
  <title>PXF architecture: the pxf cluster CLI, the pxf extension, and the PXF service on the coordinator and every WHPG segment host, connecting out to an external data source</title>
  <desc>The pxf cluster CLI, run from a shell, reaches into a WHPG cluster with a coordinator, cdw, and two segment hosts, sdw1 and sdw2, grouped separately to show that the coordinator plays a different role. Each host runs a pxf extension paired with a PXF service. Each segment host's PXF service connects independently to an external data source such as an object store, Hadoop, Hive, HBase, or a SQL database.</desc>

  <defs>
    <marker id="pxf-ah" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#F89E5D"/>
    </marker>
    <marker id="pxf-ah-rev" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#F89E5D"/>
    </marker>
    <marker id="pxf-ah-teal" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#429D9E"/>
    </marker>
  </defs>

  <rect width="720" height="300" rx="8" fill="#ffffff"/>

  <!-- pxf cluster CLI -->
  <rect x="75" y="14" width="200" height="34" rx="6" fill="#F4F8F9" stroke="#429D9E" stroke-width="1.5"/>
  <text x="175" y="31" dominant-baseline="central" text-anchor="middle" font-size="11" font-weight="700" fill="#429D9E">pxf cluster CLI</text>
  <line x1="175" y1="48" x2="175" y2="62" stroke="#429D9E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pxf-ah-teal)"/>

  <!-- WHPG cluster -->
  <rect x="15" y="62" width="320" height="224" rx="8" fill="#136A7F"/>
  <text x="175" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">WHPG cluster</text>

  <!-- Coordinator: cdw (visually distinct, outside the segment-host group) -->
  <text x="175" y="105" text-anchor="middle" font-size="9" font-weight="600" fill="rgba(255,255,255,0.7)">cdw</text>
  <rect x="59" y="109" width="110" height="34" rx="5" fill="rgba(255,255,255,0.18)"/>
  <text x="114" y="126" dominant-baseline="central" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">pxf extension</text>
  <line x1="169" y1="126" x2="181" y2="126" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <rect x="181" y="109" width="110" height="34" rx="5" fill="#429D9E"/>
  <text x="236" y="126" dominant-baseline="central" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">PXF service</text>

  <!-- Segment hosts group (dashed grouping to set them apart from the coordinator) -->
  <rect x="32" y="151" width="286" height="127" rx="6" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Segment host sdw1 -->
  <text x="175" y="177" text-anchor="middle" font-size="9" font-weight="600" fill="rgba(255,255,255,0.7)">sdw1</text>
  <rect x="59" y="181" width="110" height="34" rx="5" fill="rgba(255,255,255,0.18)"/>
  <text x="114" y="198" dominant-baseline="central" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">pxf extension</text>
  <line x1="169" y1="198" x2="181" y2="198" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <rect x="181" y="181" width="110" height="34" rx="5" fill="#429D9E"/>
  <text x="236" y="198" dominant-baseline="central" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">PXF service</text>

  <!-- Segment host sdw2 -->
  <text x="175" y="225" text-anchor="middle" font-size="9" font-weight="600" fill="rgba(255,255,255,0.7)">sdw2</text>
  <rect x="59" y="229" width="110" height="34" rx="5" fill="rgba(255,255,255,0.18)"/>
  <text x="114" y="246" dominant-baseline="central" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">pxf extension</text>
  <line x1="169" y1="246" x2="181" y2="246" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <rect x="181" y="229" width="110" height="34" rx="5" fill="#429D9E"/>
  <text x="236" y="246" dominant-baseline="central" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">PXF service</text>

  <!-- Arrows: each segment host's PXF service reads/writes independently -->
  <line x1="299" y1="198" x2="377" y2="198" stroke="#F89E5D" stroke-width="1.5" marker-start="url(#pxf-ah-rev)" marker-end="url(#pxf-ah)"/>
  <line x1="299" y1="246" x2="377" y2="246" stroke="#F89E5D" stroke-width="1.5" marker-start="url(#pxf-ah-rev)" marker-end="url(#pxf-ah)"/>

  <!-- External data source -->
  <rect x="385" y="62" width="320" height="224" rx="8" fill="#F4F8F9" stroke="#429D9E" stroke-width="1.5"/>
  <text x="545" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#429D9E">External data source</text>

  <rect x="405" y="124" width="134" height="44" rx="5" fill="#E8F2F3"/>
  <text x="472" y="151" text-anchor="middle" font-size="10" fill="#555">Object store</text>
  <rect x="551" y="124" width="134" height="44" rx="5" fill="#E8F2F3"/>
  <text x="618" y="151" text-anchor="middle" font-size="10" fill="#555">Hadoop (HDFS)</text>
  <rect x="405" y="200" width="134" height="44" rx="5" fill="#E8F2F3"/>
  <text x="472" y="227" text-anchor="middle" font-size="10" fill="#555">Hive / HBase</text>
  <rect x="551" y="200" width="134" height="44" rx="5" fill="#E8F2F3"/>
  <text x="618" y="227" text-anchor="middle" font-size="10" fill="#555">SQL database</text>
</svg>
