name: generate HM operator release notes

# Drafts release notes for a Hybrid Manager operator release and opens a PR for
# review. The operator repo is private, so there is nothing customer-facing to
# link to - the generated notes carry no issue or pull request references, and
# internal ticket IDs stay in the yaml source (relgen never renders them).
#
# Triggered by edb-hcp-operator after a release is cut, or run by hand.

on:
  repository_dispatch:
    types: [hm-operator-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Operator version being released, without the leading v (e.g. 2.1.0)"
        required: true
        type: string
      previous_version:
        description: "(Optional) Version to diff against, without the leading v. Defaults to the previous 2.x release tag."
        required: false
        type: string

run-name: Draft HM operator release notes for ${{ github.event.client_payload.version || inputs.version }}

env:
  SOURCE_REPO: EnterpriseDB/edb-hcp-operator
  VERSION: ${{ github.event.client_payload.version || inputs.version }}
  PREVIOUS_VERSION: ${{ github.event.client_payload.previous_version || inputs.previous_version }}
  RELNOTES_PATH: product_docs/docs/hm-operator/2/rel_notes
  CLAUDE_MODEL_ID: ${{ vars.CLAUDE_MODEL_ID || 'us.anthropic.claude-opus-4-6-v1' }}

# One draft per version at a time - a re-run supersedes an in-flight one rather
# than racing it to the same branch.
concurrency:
  group: hm-operator-relnotes-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: true

jobs:
  draft-relnotes:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write # for Bedrock OIDC
    steps:
      - name: Check inputs
        run: |
          set -euo pipefail
          if [ -z "${VERSION}" ]; then
            echo "::error title=missing input::must provide the operator version"
            exit 1
          fi
          # Guard the version before it reaches a git ref or a file path.
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=bad version::expected a bare semver version like 2.1.0, got '${VERSION}'"
            exit 1
          fi
          if [ -n "${PREVIOUS_VERSION}" ] && ! [[ "${PREVIOUS_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=bad version::expected a bare semver previous_version, got '${PREVIOUS_VERSION}'"
            exit 1
          fi

      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          path: destination

      - name: Checkout operator repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SYNC_FILES_TOKEN }}
          fetch-depth: 0
          path: source

      - name: Collect changes since the previous release
        id: changes
        working-directory: source
        run: |
          set -euo pipefail

          if [ -n "${PREVIOUS_VERSION}" ]; then
            PREV="v${PREVIOUS_VERSION}"
          else
            # Newest 2.x release tag below this one, ignoring pre-releases.
            PREV=$(git tag --list 'v2.*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | awk -v cur="v${VERSION}" '$0 == cur {exit} {last=$0} END {print last}')
          fi

          if [ -z "${PREV}" ]; then
            echo "::error title=no baseline::could not determine a previous 2.x release tag; pass previous_version explicitly"
            exit 1
          fi
          for ref in "${PREV}" "v${VERSION}"; do
            if ! git rev-parse -q --verify "refs/tags/${ref}" >/dev/null; then
              echo "::error title=missing tag::${ref} does not exist in ${SOURCE_REPO}"
              exit 1
            fi
          done

          echo "previous=${PREV}" >> "$GITHUB_OUTPUT"

          # Only user-visible commit types, minus the automation that dominates
          # this repo's history: version-set build triggers, the CVE/image
          # auto-bump bot, robot syncs and snapshot/UAT plumbing.
          git log --format='%s' "${PREV}..v${VERSION}" \
            | grep -E '^(feat|fix|perf|revert|chore)' \
            | grep -vE 'UPM-0+\b|UPM-00000|UPM-65837|Sync from|skip ci|snapshot|bump UAT|auto-bump' \
            | sed -E 's/ \(#[0-9]+\)$//' \
            | sort -u > "${GITHUB_WORKSPACE}/commits.txt"

          echo "Collected $(wc -l < "${GITHUB_WORKSPACE}/commits.txt") candidate commits from ${PREV}..v${VERSION}"
          if [ ! -s "${GITHUB_WORKSPACE}/commits.txt" ]; then
            echo "::error title=no changes::no customer-relevant commits found between ${PREV} and v${VERSION}"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
          aws-region: us-east-1

      - name: Draft the release notes yaml
        # Pinned to a commit SHA - this action runs with
        # --dangerously-skip-permissions and Bedrock OIDC STS creds. The
        # floating @v1 tag can be repointed. Bump deliberately.
        uses: anthropics/claude-code-action@38ec876110f9fbf8b950c79f534430740c3ac009 # v1.0.101
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--model ${{ env.CLAUDE_MODEL_ID }} --dangerously-skip-permissions"
          show_full_output: "true"
          prompt: |
            You are drafting customer-facing release notes for version ${{ env.VERSION }} of the EDB Hybrid Manager (HM) operator, a Kubernetes operator that installs and manages Hybrid Manager by reconciling the `HybridControlPlane` custom resource.

            ## Your inputs

            - `commits.txt` in the workspace root: candidate commit subjects between ${{ steps.changes.outputs.previous }} and v${{ env.VERSION }}, already filtered down to user-visible commit types and de-duplicated. Commits follow the conventional commits convention (`feat`, `fix`, `chore`, `perf`, `revert`), each carrying an internal Jira ID like `UPM-12345`. Subjects only - use `git log` in `source/` when you need a commit body or its diff.
            - `source/`: a full checkout of the operator repo at the release tag. Read the code, the Helm chart under `deploy/charts/edb-hcp-operator`, and the CRD definitions whenever a commit subject alone does not tell you what actually changed for a user.
            - `destination/${{ env.RELNOTES_PATH }}/src/`: existing release notes yaml. Read `2.0.0_rel_notes.yml` and follow its structure, tone, and level of detail closely.

            ## What to write

            Write exactly one new file: `destination/${{ env.RELNOTES_PATH }}/src/${{ env.VERSION }}_rel_notes.yml`.

            Conform to the schema at `destination/tools/automation/generators/relgen/relnote-schema.json`, documented in `destination/tools/automation/generators/relgen/schema-readme.md`. Set `product: Hybrid Manager operator`, `version: ${{ env.VERSION }}`, and `date` as today's date in `DD Month YYYY` form with the month spelled out in full (the generator rejects abbreviated months).

            For every entry set:
            - `type`: one of `Feature`, `Enhancement`, `Change`, `Bug Fix`, `Deprecation`, `Security`. Map the conventional commit type as a starting point (`feat` to Feature or Enhancement, `fix` to Bug Fix, a behavioural change to Change), but let what actually changed decide.
            - `impact`: `Highest`, `High`, `Medium`, `Low`, or `Lowest`. This controls ordering within a section, so rank by how much a user needs to know, not by engineering effort.
            - `jira`: the internal Jira ID. This is recorded for traceability and is never rendered on the published page.
            - `addresses`: leave empty. The operator repo is private, so there is nothing linkable.

            ## Editorial rules

            - Write for someone running HM in their own Kubernetes cluster. Include only what affects them: new capabilities, changed or removed behaviour, deprecations, and bugs they could have hit. Drop internal-only work - tests, refactors, CI, release plumbing, UAT environments, version-set bumps. Keep a chore only when it has a visible consequence.
            - Never put internal ticket references (UPM-12345), branch names, or commit SHAs in `relnote`, `details`, `intro`, or `highlights`. The `jira` field is the only place an ID belongs.
            - `relnote` is a short noun phrase naming the change, not a sentence describing the commit. `details` is one to three sentences on what changed and what the user does about it. Name the actual `HybridControlPlane` fields, Helm values, or `edbctl` commands involved.
            - Describe the change, not the fix: "You can now set X" rather than "Added support for setting X". For bug fixes, lead with what was wrong from the user's point of view.
            - Collapse several commits that add up to one user-visible change into a single entry. Do not emit one entry per commit.
            - Anything requiring user action must say so, starting the `details` with `**Action required.**`.
            - Write `highlights` as two to four bulleted items covering only the things that would change someone's upgrade decision, each leading with a bolded sentence. Omit `highlights` entirely if nothing in the release rises to that bar.
            - Use British-neutral EDB house style: sentence case headings, `Postgres` not `PostgreSQL` when speaking generally, backticks for field, command, and resource names.
            - Where you are unsure whether something is customer-relevant or cannot tell what a change does, leave it out and note it in a `# REVIEW:` comment at the end of the file rather than guessing. A reviewer will resolve it.

            Write only that one file. Do not run the generator, commit, or open a PR - later steps handle that.

      - name: Regenerate release notes pages
        working-directory: destination
        run: |
          set -euo pipefail
          if [ ! -f "${RELNOTES_PATH}/src/${VERSION}_rel_notes.yml" ]; then
            echo "::error title=nothing drafted::expected ${RELNOTES_PATH}/src/${VERSION}_rel_notes.yml"
            exit 1
          fi
          npm --prefix ./tools/automation/generators/relgen ci
          ./tools/automation/generators/relgen/relgen.js -p "${RELNOTES_PATH}"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          path: destination/
          base: develop
          branch: hm-operator-relnotes/${{ env.VERSION }}
          title: "HM operator ${{ env.VERSION }} - Release notes"
          commit-message: "HM operator ${{ env.VERSION }} - Add release notes"
          token: ${{ secrets.GITHUB_TOKEN }}
          reviewers: ${{ vars.HM_OPERATOR_RELNOTES_REVIEWERS }}
          body: |
            Draft release notes for HM operator ${{ env.VERSION }}, generated from commits between `${{ steps.changes.outputs.previous }}` and `v${{ env.VERSION }}` in ${{ env.SOURCE_REPO }}.

            Edit `${{ env.RELNOTES_PATH }}/src/${{ env.VERSION }}_rel_notes.yml` - the `.mdx` files are generated from it and regenerate automatically on push.

            ## Reviewing
            - **Check nothing significant is missing.** The commit log is a poor guide to what matters most in a release; the headline change is often the one nobody wrote a commit about.
            - Confirm each entry is something a customer can observe, and that `type` and `impact` are right - `impact` sets the order within each section.
            - Check no internal ticket IDs, branch names, or commit SHAs leaked into the customer-facing text. `jira:` is the only place they belong.
            - Resolve any `# REVIEW:` comments the draft left behind, then delete them.
            - Update `product_docs/docs/hm-operator/2/compatibility_matrix.mdx` with the HM versions this operator release supports.
