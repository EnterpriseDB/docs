name: Forward key events to the docs-tools repository
on:
  pull_request:
    types:
      [
        opened,
        reopened,
        synchronize,
        closed,
        labeled,
        unlabeled,
        edited,
        ready_for_review,
        converted_to_draft,
      ]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  push:
  create:
  delete:
  release:
jobs:
  dispatch-events:
    # Only pull_request itself can point at unvetted fork code (e.g. via
    # synchronize); those events are excluded here and handled instead by the
    # poll-fork-prs poller. pull_request_review and issue_comment are always
    # generated by the base repo we trust, so they're never excluded.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    steps:
      - name: Check eligibility of PR comment events
        id: comment-check
        if: github.event_name == 'issue_comment'
        run: |
          if [ -z "${{ github.event.issue.pull_request.url }}" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Comment is on an issue, not a pull request; skipping."
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create event name
        if: github.event_name != 'issue_comment' || steps.comment-check.outputs.eligible == 'true'
        run: |
          EVENT_PREFIX="docs-${GITHUB_REPOSITORY//\//-}"
          echo EVENT_PREFIX="${EVENT_PREFIX@L}" >> $GITHUB_ENV
      - name: Repository Dispatch
        if: github.event_name != 'issue_comment' || steps.comment-check.outputs.eligible == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{  secrets.GH_SLONIK || secrets.TOOLS_EVENT_SYNC_PAT }}
          repository: enterprisedb/docs-tools
          event-type: ${{ env.EVENT_PREFIX }}-${{ github.event_name }}
          client-payload: |
            {
              "ref": ${{ toJSON(github.event_name == 'pull_request' && github.head_ref || github.event.ref || github.ref) }},
              "ref_type": "${{ github.ref_type }}",
              "ref_name": ${{ toJSON(github.ref_name) }},
              "repo": "${{ github.repository }}",
              "sha": "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}",
              "type": "${{ github.event_name }}",
              "action": "${{ github.event.action }}",
              "sender": ${{ toJSON(github.event.sender.login) }},
              "push": {
                "before": "${{ github.event.before || '' }}",
                "after": "${{ github.event.after || '' }}",
                "created": ${{ github.event.created || false }},
                "deleted": ${{ github.event.deleted || false }}
              },
              "pull_request": {
                "html_url": ${{ github.event.pull_request && toJSON(github.event.pull_request.html_url) || github.event.issue && toJSON(github.event.issue.pull_request.html_url) || '""' }},
                "number": "${{ github.event.pull_request.number || github.event.issue.number || '' }}",
                "state": "${{ github.event.pull_request && github.event.pull_request.state || '' }}",
                "title": ${{ github.event.pull_request && toJSON(github.event.pull_request.title) || github.event.issue && toJSON(github.event.issue.title) || '""' }},
                "body": ${{ github.event.pull_request && toJSON(github.event.pull_request.body) || '""' }},
                "draft": ${{ github.event.pull_request && github.event.pull_request.draft || false }},
                "merged": ${{ github.event.pull_request && github.event.pull_request.merged || false }},
                "merged_by": ${{ github.event.pull_request && toJSON(github.event.pull_request.merged_by.login) || '""' }},
                "updated_at": "${{ github.event.pull_request.updated_at || '' }}",
                "user": { "login": ${{ github.event.pull_request && toJSON(github.event.pull_request.user.login) || '""' }} },
                "labels": ${{ github.event.pull_request && toJSON(github.event.pull_request.labels) || '[]' }},
                "base": ${{ github.event.pull_request && toJSON(github.event.pull_request.base) || '""' }}
              },
              "label": {
                "name": ${{ github.event.label && toJSON(github.event.label.name) || '""' }}
              },
              "changes": {
                "title": ${{ github.event.changes.title && true || false }},
                "body": ${{ github.event.changes.body && true || false }}
              },
              "review": {
                "state": ${{ github.event.review && toJSON(github.event.review.state) || '""' }},
                "html_url": ${{ github.event.review && toJSON(github.event.review.html_url) || '""' }},
                "body": ${{ github.event.review && toJSON(github.event.review.body) || '""' }}
              },
              "comment": {
                "html_url": ${{ github.event.comment && toJSON(github.event.comment.html_url) || '""' }},
                "body": ${{ github.event.comment && toJSON(github.event.comment.body) || '""' }}
              },
              "release": {
                "tag_name": ${{ github.event.release && toJSON(github.event.release.tag_name) || '""' }},
                "id": "${{ github.event.release && github.event.release.id || '' }}",
                "name": ${{ github.event.release && toJSON(github.event.release.name) || '""' }},
                "body": ${{ github.event.release && toJSON(github.event.release.body) || '""' }},
                "draft": ${{ github.event.release && github.event.release.draft || false }}
              }
            }
