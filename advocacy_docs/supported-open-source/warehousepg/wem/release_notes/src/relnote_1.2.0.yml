# yaml-language-server: $schema=https://raw.githubusercontent.com/EnterpriseDB/docs/refs/heads/develop/tools/automation/generators/relgen/relnote-schema.json
product: WarehousePG Enterprise Manager
version: 1.2.0
date: 2 June 2026
intro: |
  WEM 1.2.0 includes new features, enhancements, and bug fixes.
highlights: |
  - **Resource management schedules:** Define schedules to automatically apply [resource group and resource queue settings](../performance/managing-resources#scheduling-resource-limits) at specific days and times. Each schedule can target multiple groups at once, supports dry-run preview, manual activation, and pause/resume controls, and logs every execution in a history view.
  - **Query Editor as a standalone page:** The [**Query Editor**](../performance/query-monitor#using-the-query-editor) is now a top-level page with dedicated role-based access controls, making it easier to find and govern SQL authoring separately from workload monitoring.
  - **Configuration History:** A new [**Configuration History**](../monitoring/cluster-overview#reviewing-configuration-changes) tab on the **Cluster** page provides a time-ordered audit trail of configuration parameter changes, helping teams quickly identify what changed and when.
  - **Prometheus remote write receiver:** WEM can now accept inbound metrics from Grafana Alloy or any Prometheus-compatible client, unifying cluster and infrastructure metrics at the [`/prom/metrics`](../installing/wem#remote-write-receiver-optional) endpoint.
  - **Service identity and PXF integration:** The WEM system service now runs as `gpadmin` instead of root, which is required for PXF integration. Two new CLI commands, `wem configure-pxf-sandbox` and `wem configure-user`, handle post-install PXF configuration and OS user changes. No manual steps are required when upgrading from 1.0 or 1.1. See [Upgrading WEM](../installing/upgrading).
relnotes:
- relnote: "Alerts subsystem: WEM's internal alert engine is removed"
  details: |
    Alert rules are now defined as Prometheus rule files. Recreate any rules previously configured through WEM as Prometheus YAML files. See the [Reference](../reference) section for the pre-built rules shipped with WEM.
  jira: PTT-1061
  addresses: ""
  type: Change
  impact: High
- relnote: The `gpadmin` OS user is now required for fresh installs
  details: |
    The installer fails if `gpadmin` doesn't exist on the WEM host. On hosts where the older WEM ran as `root`, the upgrade automatically configures WEM to continue running as root. See [Prerequisites](../installing/prerequisites) and [Upgrading WEM](../installing/upgrading).
  jira: [PTT-1080, PTT-1161]
  addresses: ""
  type: Change
  impact: High
- relnote: Force password change
  details: |
    Administrators can now require a user to change their password at next login directly from the WEM interface. See [Managing the user lifecycle](../system-access/management#managing-the-user-lifecycle).
  jira: PTT-1035
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Role-level Postgres settings
  details: |
    You can now configure Postgres parameters at the role level from the role edit form in [Access Management](../system-access/access-management#configuring-role-level-postgres-settings). Role-level settings override cluster-wide defaults for sessions started by that role.
  jira: PTT-898
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Admin-only action enforcement
  details: |
    Action buttons restricted to Admin users are now disabled rather than hidden for non-admin users, making permission boundaries visible across the interface.
  jira: null
  addresses: ""
  type: Feature
  impact: Low
- relnote: Reason input on cancel and terminate dialogs
  details: |
    When canceling a query or terminating a session, you can now provide an optional reason. The reason is recorded in the WEM audit log. See [Monitoring and evaluating queries](../performance/query-monitor).
  jira: PTT-993
  addresses: ""
  type: Feature
  impact: Low
- relnote: Date-range picker in System Metrics
  details: |
    The [System Metrics](../monitoring/system-metrics#selecting-a-time-range) page now includes a date-range picker, giving you precise control over the time window displayed across all charts and tables.
  jira: PTT-983
  addresses: ""
  type: Feature
  impact: Medium
- relnote: State column in Sessions
  details: |
    The **Sessions** tab in [Query Monitoring](../performance/query-monitor#resolving-connection-leaks-and-session-bloat) now includes a **State** column showing the current connection state. The **Connections** column is removed.
  jira: PTT-977
  addresses: ""
  type: Feature
  impact: Low
- relnote: Fixed the username not displaying in the top right of the screen when the user's full name is empty.
  jira: PTT-1057
  addresses: ""
