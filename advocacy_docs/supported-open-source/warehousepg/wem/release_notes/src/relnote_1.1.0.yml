- relnote: "WEM user passwords now require at least one uppercase letter, lowercase letter, digit, and special character."
  details: |
    Existing scripts or automation that create WEM users with simple passwords need to be updated.
  jira: null
  addresses: ""
  type: Security
  impact: High
- relnote: WEM now requires the WEM_COOKIE_SECRET environment variable to be set, and returns an actionable error if it's missing.
  jira: null
  addresses: ""
  type: Security
  impact: High
- relnote: Debug endpoints are now only registered when DEBUG mode is enabled.
  jira: null
