- relnote: "Added CSRF protection using a double-submit token pattern."
  details: |
    All state-modifying requests (POST, PUT, PATCH, DELETE) now require a valid `X-CSRF-Token` header.
  jira: null
  addresses: ""
  type: Security
  impact: High
