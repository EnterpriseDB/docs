# yaml-language-server: $schema=https://raw.githubusercontent.com/EnterpriseDB/docs/refs/heads/develop/tools/automation/generators/relgen/relnote-schema.json
product: WarehousePG Enterprise Manager
version: 1.1.0
date: 4 May 2026
intro: |
  WarehousePG Enterprise Manager (WEM) 1.1.0 includes new features, enhancements, and bug fixes focused on improving stability and reliability.
relnotes:
- relnote: Background Processes tab
  details: |
    The **Query Monitoring** page now includes a dedicated **Background Processes** tab that separates internal database background processes from active user queries.
  jira: PTT-881
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Visual query plan graphs
  details: |
    The **Query Editor** now renders a visual graph for static query execution plans, making it easier to understand and optimize query performance.
  jira: PTT-923
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Remote pg_hba.conf editing
  details: |
    The **HBA Editor** now supports editing `pg_hba.conf` when WEM runs on a different host than the database server. In remote mode, the editor reconstructs the current configuration from database entries and provides a **Generate Commands** button that produces shell commands, including a backup step and a configuration reload, ready to copy and run on the coordinator host.
  jira: PTT-877
  addresses: ""
  type: Feature
  impact: High
- relnote: Database size growth chart
  details: |
    A new **Database Size Growth** chart in the **Historical Trends** tab on the **System Metrics** page shows how each database's size has changed over time. Requires Prometheus and the observability Collector to be configured.
  jira: PTT-892
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Role management
  details: |
    You can now create, edit, and delete database roles directly from the **Access Management** page.
  jira: PTT-896
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Group role membership
  details: |
    The **Access Management** page now displays the members of each group role.
  jira: PTT-897
  addresses: ""
  type: Feature
  impact: Low
- relnote: Build details in version display
  details: |
    The WEM version display now includes the commit ID and build date alongside the version number.
  jira: PTT-969
  addresses: ""
  type: Feature
  impact: Low
- relnote: Configuration parameter source
  details: |
    The **System Settings** tab in **Access Management** now includes source and source file columns for each configuration parameter, sorted alphabetically by name.
  jira: PTT-899
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Materialized views
  details: |
    Views and materialized views are now displayed separately in the **Data Analysis** page. Materialized views now include size and storage options.
  jira: PTT-900
  addresses: ""
  type: Enhancement
  impact: Medium
- relnote: Actionable data analysis
  details: |
    The **Missing Stats** and **Bloat** sections on the **Data Analysis** page now offer direct remediation actions.
  jira: [PTT-903, PTT-904]
  addresses: ""
  type: Enhancement
  impact: Medium
- relnote: Clickable log severity cards
  details: |
    Clicking a severity count card on the **Logs** page now filters the log list to that severity.
  jira: PTT-902
  addresses: ""
  type: Enhancement
  impact: Low
- relnote: Configurable long-running query threshold
  details: |
    The **Connection & Query Metrics** section in the **Database Metrics** tab on the **System Metrics** page has been improved, and the threshold for flagging long-running queries is now configurable through the WEM interface as well as the `LONG_RUNNING_THRESHOLD` environment variable.
  jira: PTT-981
  addresses: ""
  type: Enhancement
  impact: Medium
- relnote: Canary monitoring
  details: |
    The **Monitoring** page is reorganized into **Current Status**, **Recent Results**, and **Trends** tabs, with additional admin controls.
  jira: PTT-957
  addresses: ""
  type: Enhancement
  impact: Medium
- relnote: Canary check updates
  details: |
    Canary check updates now use pointer-based partial updates, and system-defined checks are protected from modification.
  jira: PTT-944
  addresses: ""
  type: Enhancement
  impact: Low
- relnote: Sortable Storage Details columns
  details: |
    Columns in the **Storage Details** table in the **Overview** tab of the **Storage** page can now be sorted.
  jira: PTT-978
  addresses: ""
  type: Enhancement
  impact: Low
- relnote: Segment Details filters
  details: |
    The **Cluster Segment Details** table now supports filtering by **Role**, **Status**, and **Hostname**.
  jira: PTT-975
  addresses: ""
  type: Enhancement
  impact: Medium
- relnote: Management page permission enforcement
  details: |
    Non-admin users who navigate to a restricted **Management** page now receive a 403 access denied page. Destructive actions on the **Management** page now prompt for confirmation before proceeding.
  jira: PTT-955
  addresses: ""
  type: Enhancement
  impact: Medium
- relnote: Settings form validation and unsaved-changes warning
  details: |
    The **Settings** tab in **Management** now validates URL, integer, and duration fields inline. Navigating away or closing the browser with unsaved changes triggers a warning, and changes to critical connectivity settings require explicit confirmation.
  jira: PTT-956
  addresses: ""
  type: Enhancement
  impact: Medium
- relnote: Query Monitoring session improvements
  details: |
    The **Sessions** table now displays an **Active** column showing **Yes** or **No**. The **Filters** dropdown includes a new **Active** option to filter sessions by active status. Canceling a query is disabled for sessions in an idle state.
  jira: PTT-961
  addresses: ""
  type: Enhancement
  impact: Medium
- relnote: Viewer profile defaults
  details: |
    The **Logs** tab is no longer included in the **Viewer** profile by default.
  jira: PTT-991
  addresses: ""
  type: Enhancement
  impact: Low
- relnote: Added support for a new WarehousePG installation path
  details: |
    WEM 1.1 adds support for the `/usr/edb/whpg<version>` installation path introduced in WarehousePG 7.4 and 6.27.4.
  jira: null
  addresses: ""
  type: Change
  impact: Medium
