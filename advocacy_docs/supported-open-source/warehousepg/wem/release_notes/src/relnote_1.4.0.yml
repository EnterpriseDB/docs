product: WarehousePG Enterprise Manager
version: 1.4.0
date: 21 September 2026
intro: |
  WEM 1.4.0 includes new features, enhancements, and bug fixes.
highlights: |
  - **ClickHouse for metrics and logs:** WEM now stores and queries all metrics and logs in ClickHouse instead of Prometheus and Loki. The **Alerts** panel and the **Logs** panel both move to this unified pipeline. See [Managing alerts](../monitoring/alerts) and [Auditing system logs](../monitoring/logs).
  - **Mutual TLS for host agent connections:** Every connection between the host agent and WEM is now authenticated with mutual TLS (mTLS). WEM's internal certificate authority issues each agent a short-lived certificate and renews it automatically. See [Installing the host agent](../installing/host-agent).
  - **Host agent self-registration:** Host agents register themselves with WEM on first connection instead of requiring manual enrollment. A new admin tab lets Admins approve or reject pending registrations. See [Installing the host agent](../installing/host-agent).
  - **Cluster Management:** Start, stop, restart, and recover a segment (`gprecoverseg`) directly from the WEM UI, dispatched through the host agent. See [Verifying the cluster health](../monitoring/cluster-overview).
  - **Backup and restore scheduling:** Schedule recurring backup and restore jobs from within WEM instead of relying on external cron jobs. See [Securing backups](../protecting-data/backups).
  - **Per-action access control:** Admins can grant permissions for individual actions, such as running or deleting a backup, in addition to the existing tab-level permissions. See [Performing administrative management](../system-access/management).
  - **PXF in its own tab:** PXF management moves out of **External Tables** and into a dedicated tab in **Data Analysis**, with sync and restart support. See [Analyzing data distribution](../performance/data-analysis).
relnotes:
- relnote: Cluster Management actions
  details: |
    A new **Cluster Management** panel lets Operators and Admins start, stop, and restart the WarehousePG cluster, and run `gprecoverseg` to recover a failed segment, without shell access to the coordinator. Commands are dispatched through the host agent and gated by access control. See [Verifying the cluster health](../monitoring/cluster-overview).
  jira: "420, 26"
  addresses: ""
  type: Feature
  impact: High
- relnote: Backup and restore scheduling
  details: |
    The **Backups** panel supports recurring backup and restore schedules, alongside the existing find-table, display-report, and delete-backup operations. Backup timestamps now show in the host agent's own operating system time zone instead of the WEM server's, so scheduled times are unambiguous across regions. See [Securing backups](../protecting-data/backups).
  jira: "423, 438, 29, 33, 27, 41"
  addresses: ""
  type: Feature
  impact: High
- relnote: Mutual TLS host agent authentication
  details: |
    Each host agent now presents a short-lived certificate issued by WEM's internal certificate authority, renewed automatically before it expires. A 24-hour grace window lets an agent that was briefly offline recover its certificate without Admin intervention. See [Installing the host agent](../installing/host-agent).
  jira: "429, 38"
  addresses: ""
  type: Feature
  impact: High
- relnote: Host agent self-registration and approval
  details: |
    Host agents register themselves with WEM on startup and receive a Temporal task queue assignment automatically, removing the need to set `WEM_TASK_QUEUES` by hand in most deployments. A new **Host Agents** admin tab shows each agent's registration status, certificate expiry, and last heartbeat, with one-click approve or revoke actions. See [Installing the host agent](../installing/host-agent).
  jira: "424, 445, 35, 43"
  addresses: ""
  type: Feature
  impact: High
- relnote: ClickHouse-backed Logs panel
  details: |
    The **Logs** panel now reads from ClickHouse instead of Loki, with the same structured search and filtering. See [Auditing system logs](../monitoring/logs).
  jira: "430"
  addresses: ""
  type: Feature
  impact: Medium
- relnote: ClickHouse-backed Alerts panel
  details: |
    The **Alerts** panel and the cluster status banner now evaluate metric thresholds against ClickHouse instead of Prometheus. See [Managing alerts](../monitoring/alerts).
  jira: "428"
  addresses: ""
  type: Feature
  impact: Medium
- relnote: PXF as a dedicated Data Analysis tab
  details: |
    PXF management (sync, restart, and status) moves from **External Tables** into its own tab under **Data Analysis**, dispatched through the host agent. See [Analyzing data distribution](../performance/data-analysis).
  jira: "417, 30, 51"
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Per-action access control grants
  details: |
    In addition to tab-level permissions, Admins can now grant or deny individual actions, such as running a backup, deleting a backup, or terminating a session, to a specific role. See [Performing administrative management](../system-access/management).
  jira: "436"
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Unified Query Editor output panel
  details: |
    Query results, `EXPLAIN`, and `ANALYZE` output now appear together in a single tabbed panel in the Query Editor, replacing the previous side-by-side layout. The database selector also supports searching and filtering. See [Authoring and tuning SQL statements](../performance/query-monitor#using-the-query-editor).
  jira: "414, 413"
  addresses: ""
  type: Feature
  impact: Medium
# TODO(mireia): verify with engineering whether the dedicated WHPG_WEM_USER role
# is actually least-privilege. As of v1.4.0-rc.1, internal/setup/setup.go creates
# it with SUPERUSER (role_create_superuser.sql), contradicting this entry's
# original wording. Holding this note neutral until confirmed either way.
- relnote: Dedicated WEM database role
  details: |
    WEM now connects to your WarehousePG cluster with a dedicated `wem` login role, created automatically during setup, instead of reusing the same superuser credentials for every connection. See [Configuring WEM](../installing/wem).
  jira: "417, 397"
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Prometheus and Loki are no longer used
  details: |
    WEM's metrics and log pipeline is fully migrated to ClickHouse. The Collector no longer pushes to Prometheus or Loki, and the SQL exporter and Prometheus remote-write receiver are removed. If you're upgrading, plan to decommission any Prometheus or Loki instances you ran solely for WEM. See [Upgrading WarehousePG Enterprise Manager](../installing/upgrading).
  jira: "426"
  addresses: ""
  type: Change
  impact: High
- relnote: "`WHPG_PXF_BIN` configuration parameter removed"
  details: |
    PXF binary discovery now always uses fixed, safe paths. If you set `WHPG_PXF_BIN` explicitly, remove it from `wem.conf` when you upgrade. See [Configuration reference](../reference/configuration).
  jira: null
  addresses: ""
  type: Change
  impact: Medium
- relnote: Refresh controls standardized
  details: |
    Refresh buttons across the application are now icon-only, with an accessible label for screen readers, instead of a mix of icon and text buttons.
  jira: "454"
  addresses: ""
  type: Change
  impact: Low
- relnote: Fixed a certificate validation gap in the mTLS grace-window check
  details: |
    A host agent certificate with a future `NotBefore` date passed the mTLS grace-window check.
  jira: "453"
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed repeated, timed-out configuration pushes to agents with expired certificates
  details: |
    WEM now skips the push immediately instead of retrying every reconcile cycle.
  jira: "451"
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Improved ClickHouse reconnection and error messages
  details: |
    WEM now reconnects to ClickHouse automatically after a transient connection failure, and error messages for connection failures and missing databases are more specific.
  jira: "440, 448"
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed scheduler contention under concurrent load
  details: |
    Contention between the canary check scheduler, backup and resource schedule checks, and alert rule loading crashed the scheduler under concurrent load.
  jira: "447, 434"
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed configuration drift correction on host agent re-registration
  details: |
    The host agent's automatic configuration push (`autoProvisionOTel`) now runs on every re-registration instead of only the first one, so configuration drift is corrected after a host restart or network interruption.
  jira: "437"
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed HBA management view gaps
  details: |
    Added a missing **Other Rules** tile to the HBA management view, corrected the superuser role label, and fixed pagination in the partition management dialog that made entries past the first page inaccessible.
  jira: "419"
  addresses: ""
  type: Bug Fix
  impact: Low
- relnote: Fixed CPU usage chart and blocked-query count
  details: |
    The CPU usage chart no longer exceeds 100% on multi-segment hosts, and the blocked-query count no longer counts a query waiting on multiple locks more than once.
  jira: "416"
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed a Query Editor crash on failed queries
  details: |
    The Query Editor no longer crashes when running `EXPLAIN` or `ANALYZE` on a query that returns an error, and a misleading success notification shown after a failed query is removed.
  jira: "409"
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: "`WHPG_WEM_USER` is now optional; `pg_hba.conf` error handling fixed"
  details: |
    `WHPG_WEM_USER` defaults gracefully when unset. Errors reading or applying `pg_hba.conf` now return a structured error response instead of an unhandled failure.
  jira: "425"
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed PXF task handlers not registering on the host agent
  details: |
    Fixed PXF task handlers on the host agent not registering at startup, which caused WEM to report "Cannot reach the PXF host agent" until the agent was restarted after PXF was installed.
  jira: "51"
  addresses: ""
  type: Bug Fix
  impact: High
- relnote: Fixed Backups panel data directory resolution after agent approval
  details: |
    The **Backups** panel didn't reliably resolve a segment's data directory right after a host agent was approved. The agent now re-registers immediately after approval.
  jira: "50"
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Reduced logging noise while a revoked certificate awaits replacement
  details: |
    Fixed excessive warning-level logging while a host agent waited for a revoked certificate to be replaced. The agent also now forces a reconnect after repeated renewal failures, so a revoked certificate is rejected promptly instead of retried indefinitely.
  jira: "46"
  addresses: ""
  type: Bug Fix
  impact: Low
- relnote: Fixed log collection on WarehousePG builds without `pg_current_logfile()`
  details: |
    Log collection is fixed on WarehousePG builds where `pg_current_logfile()` isn't available, and log scanning is consolidated into a single privileged call on the host agent instead of five separate ones.
  jira: "48"
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Fixed a host agent connection failure on hosts without IPv6 support
  details: |
    The host agent's connection to WEM resolved to an unusable IPv6 address on hosts without IPv6 support.
  jira: "48"
  addresses: ""
  type: Bug Fix
  impact: Medium
- relnote: Addressed reported security issues
  details: |
    Addressed reported security issues in API routes and host agent privileged-command handling, including a helper command that accepted an arbitrary file path and one that followed a world-writable path during binary discovery, and updated internal dependencies to pick up upstream security fixes.
  jira: "446, 39, 32, 442, 433, 14"
  addresses: ""
  type: Security
  impact: High
