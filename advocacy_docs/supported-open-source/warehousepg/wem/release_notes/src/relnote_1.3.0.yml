product: WarehousePG Enterprise Manager
version: 1.3.0
date: 10 August 2026
intro: |
  WEM 1.3.0 includes new features, enhancements, and bug fixes.
highlights: |
  - **Host agent:** WEM 1.3 provides a new `acp-host-agent` package, a separate service that runs on the WarehousePG coordinator host and executes privileged operations on behalf of WEM. The host agent connects to WEM's internal job-execution engine, which makes operations reliable and recoverable even when connectivity is interrupted. See [Installing the host agent](../installing/host-agent).
  - **Bundled Alertmanager:** WEM now runs Alertmanager as an internal managed subprocess rather than requiring a separately installed and configured instance. See [Configuring WEM](../installing/wem).
  - **Fully agent-based HBA editor:** The HBA editor now operates through the host agent regardless of whether WEM is installed on the same host as the WarehousePG coordinator. See [Modifying authentication rules](../system-access/access-management#modifying-authentication-rules).
relnotes:
- relnote: System Metrics improvements
  details: |
    The **System Metrics** views now support filtering by individual node, so you can isolate CPU, memory, and disk usage for a specific host. Time-range controls are also refactored, and charts adapt their formatting to the selected time span. See [Visualizing hardware performance](../monitoring/system-metrics).
  jira: [PTT-1186, ACP-5]
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Storage date range picker
  details: |
    The **Storage > Historical** tab now includes a date range picker for precise control over the time window for storage trend analysis. See [Planning storage capacity](../performance/storage).
  jira: PTT-1158
  addresses: ""
  type: Feature
  impact: Low
- relnote: Data Analysis improvements
  details: |
    WEM now uses dedicated database views to compute object sizes, replacing per-object size queries and reducing overhead when browsing large schemas. On WHPG 7 clusters, Admins can also switch skew calculations from a fast catalog-based estimate to an accurate mode that scans the file system for exact figures. See [Analyzing data distribution](../performance/data-analysis).
  jira: ACP-90
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Query Monitor improvements
  details: |
    A new chart on the **Longest Queries** tab shows the top 50 longest-running queries over time, making it easier to spot and investigate persistent slow queries. A new **Historical Queries** tab shows completed queries along with a cumulative query count. See [Identifying the longest-running queries](../performance/query-monitor#identifying-the-longest-running-queries) and [Monitoring and evaluating queries](../performance/query-monitor).
  jira: [PTT-700, PTT-1228, PTT-1229]
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Log viewer improvements
  details: |
    Log views now display the **User** and **Source Host** for each log entry, making it easier to trace activity back to a specific database user or client machine. The log viewer also supports fetching all matching records through server-side pagination, with a live progress counter and the option to cancel a long-running fetch, and exported CSV files match exactly what's shown in the grid. See [Auditing system logs](../monitoring/logs).
  jira: PTT-1232
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Alert rule configuration
  details: |
    Previously, creating or editing an alert rule meant editing a Prometheus rule YAML file directly. In 1.3, the **Rules** tab in the **Alerts** panel lets you create and edit rules through a builder (metric, comparison operator, threshold, and label filters), or as raw PromQL. Built-in system rules can't be deleted by anyone, including Admins. Admins can edit or delete any user-created rule, but Operators can only manage their own. The **Notifications** tab now lets you edit the Alertmanager configuration file directly to set up Slack, email, or other receivers. The **History** tab adds a rule-name filter and an Admin-only option to delete history, either entirely or by date range. See [Managing alerts](../monitoring/alerts).
  jira: [PTT-1230, PTT-1254]
  addresses: ""
  type: Feature
  impact: High
- relnote: Password reset links and CLI command
  details: |
    Admins can generate single-use password reset links for users from the **Management** panel. A new `wem reset-password` CLI command supports local or offline password resets and automatically loads `wem.conf` in standard installations. See [Performing administrative management](../system-access/management).
  jira: PTT-1242
  addresses: ""
  type: Feature
  impact: Medium
- relnote: pg_hba.conf tab improvements
  details: |
    The **pg_hba.conf** tab in **Access Management** distinguishes cluster-internal trust rules from broad-network trust rules, making it easier to spot overly permissive entries. Saving changes also now propagates the update to the standby coordinator automatically, keeping both coordinators consistent. See [Modifying authentication rules](../system-access/access-management#modifying-authentication-rules).
  jira: [PTT-979, ACP-3]
  addresses: ""
  type: Feature
  impact: Medium
- relnote: Canary Checks panel
  details: |
    The **Monitoring** panel is renamed to **Canary Checks**. Configuration of these checks, previously Admin-only in the **Management** panel, is now consolidated here. Operators and Viewers can view results. Admins can create, edit, and delete checks. See [Validating database responsiveness](../monitoring/monitoring).
  jira: null
  addresses: ""
  type: Change
  impact: Medium
- relnote: Alertmanager configuration
  details: |
    The `ALERTMANAGER_URL` and `CONFIG_PATH` configuration parameters are removed, since Alertmanager is now bundled and requires no external URL. If you're upgrading, remove these from your existing `wem.conf`. See [Upgrading WarehousePG Enterprise Manager](../installing/upgrading).
  jira: ACP-93
  addresses: ""
  type: Change
  impact: High
- relnote: Longest Queries performance
  details: |
    WEM now caches longest-running query data from the external table on a background schedule instead of scanning it on every request, cutting typical lookup times from tens of seconds to milliseconds. See [Identifying the longest-running queries](../performance/query-monitor#identifying-the-longest-running-queries).
  jira: PTT-1030
  addresses: ""
  type: Change
  impact: Medium
- relnote: Fixed the canary trend chart showing an incorrect Y-axis scale.
  details: |
    The chart now correctly shows a weighted success ratio.
