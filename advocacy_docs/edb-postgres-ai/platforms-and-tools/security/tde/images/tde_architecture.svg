<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Roboto, Arial, sans-serif">
  <title>TDE architecture: encryption of data blocks, WAL, and temporary files</title>
  <desc>
    Shared buffers in memory are unencrypted and readable by applications. The TDE encryption engine,
    using the data encryption key, encrypts data as it's written to disk: data blocks with AES-XTS,
    WAL with AES-CTR, and temporary files with AES-XTS (block-accessed) or AES-CBC (other). On disk,
    file contents are unintelligible even to system administrators.
  </desc>

  <defs>
    <marker id="arrowend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#567F8D"/>
    </marker>
    <marker id="arrowstart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#567F8D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#FFFFFF"/>

  <!-- Unencrypted in memory -->
  <g>
    <rect x="175" y="50" width="250" height="34" rx="6" fill="#28495A"/>
    <text x="300" y="72" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700" letter-spacing="0.5">UNENCRYPTED IN MEMORY</text>
    <rect x="175" y="84" width="250" height="96" fill="#E8F2F5" stroke="#A8C2CA"/>
    <text x="300" y="106" text-anchor="middle" fill="#28495A" font-size="13" font-weight="700">Shared Buffers</text>
    <g font-size="12" font-weight="600" fill="#28495A">
      <rect x="219" y="118" width="44" height="36" fill="#FFFFFF" stroke="#A8C2CA"/>
      <text x="241" y="141" text-anchor="middle">8k</text>
      <rect x="273" y="118" width="44" height="36" fill="#FFFFFF" stroke="#A8C2CA"/>
      <text x="295" y="141" text-anchor="middle">8k</text>
      <rect x="327" y="118" width="44" height="36" fill="#FFFFFF" stroke="#A8C2CA"/>
      <text x="349" y="141" text-anchor="middle">8k</text>
    </g>
  </g>

  <!-- Remote host / app -->
  <g>
    <text x="820" y="46" text-anchor="middle" fill="#28495A" font-size="14" font-weight="700" letter-spacing="0.5">REMOTE HOST</text>
    <rect x="700" y="60" width="240" height="100" rx="10" fill="#E8F2F5" stroke="#A8C2CA"/>
    <rect x="780" y="95" width="80" height="40" rx="6" fill="#FFFFFF" stroke="#A8C2CA"/>
    <text x="820" y="120" text-anchor="middle" fill="#28495A" font-size="13" font-weight="700">App</text>
  </g>

  <!-- Memory -> App -->
  <line x1="425" y1="115" x2="695" y2="115" stroke="#567F8D" stroke-width="2.5" marker-end="url(#arrowend)"/>

  <!-- Master encryption key -->
  <g>
    <circle cx="95" cy="285" r="20" fill="none" stroke="#E7C568" stroke-width="5"/>
    <line x1="115" y1="285" x2="158" y2="285" stroke="#E7C568" stroke-width="7" stroke-linecap="round"/>
    <line x1="140" y1="285" x2="140" y2="298" stroke="#E7C568" stroke-width="7" stroke-linecap="round"/>
    <line x1="152" y1="285" x2="152" y2="296" stroke="#E7C568" stroke-width="7" stroke-linecap="round"/>
    <text x="110" y="345" text-anchor="middle" fill="#28495A" font-size="12" font-weight="700">Master Encryption Key</text>
  </g>

  <!-- Key -> engine -->
  <line x1="168" y1="288" x2="228" y2="295" stroke="#567F8D" stroke-width="2.5" marker-end="url(#arrowend)"/>

  <!-- Engine (anchor node) -->
  <g>
    <circle cx="300" cy="300" r="72" fill="#28495A"/>
    <text x="300" y="290" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">TDE</text>
    <text x="300" y="308" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">ENCRYPTION</text>
    <text x="300" y="323" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600">ENGINE</text>
  </g>

  <!-- Engine <-> memory -->
  <line x1="300" y1="228" x2="300" y2="183" stroke="#567F8D" stroke-width="2.5" marker-end="url(#arrowend)" marker-start="url(#arrowstart)"/>

  <!-- Engine <-> disk -->
  <line x1="300" y1="372" x2="300" y2="417" stroke="#567F8D" stroke-width="2.5" marker-end="url(#arrowend)" marker-start="url(#arrowstart)"/>

  <!-- Encrypted on disk -->
  <g>
    <rect x="175" y="420" width="250" height="34" rx="6" fill="#28495A"/>
    <text x="300" y="442" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700" letter-spacing="0.5">ENCRYPTED ON DISK</text>
    <rect x="175" y="454" width="250" height="126" fill="#E8F2F5" stroke="#A8C2CA"/>

    <!-- Data blocks row -->
    <g>
      <ellipse cx="205" cy="478" rx="16" ry="6" fill="#FFFFFF" stroke="#28495A" stroke-width="1.5"/>
      <path d="M189,478 L189,490 A16,6 0 0 0 221,490 L221,478" fill="#FFFFFF" stroke="#28495A" stroke-width="1.5"/>
      <text x="235" y="474" fill="#28495A" font-size="11" font-weight="700">Data blocks</text>
      <text x="235" y="488" fill="#567F8D" font-size="9">Tables &amp; indexes</text>
      <rect x="330" y="466" width="78" height="22" rx="11" fill="#FFFFFF" stroke="#A8C2CA"/>
      <text x="369" y="481" text-anchor="middle" fill="#28495A" font-size="10" font-weight="700">AES-XTS</text>
    </g>

    <!-- WAL row -->
    <g>
      <rect x="191" y="506" width="28" height="22" rx="3" fill="#FFFFFF" stroke="#28495A" stroke-width="1.5"/>
      <line x1="196" y1="512" x2="214" y2="512" stroke="#28495A" stroke-width="1.5"/>
      <line x1="196" y1="518" x2="214" y2="518" stroke="#28495A" stroke-width="1.5"/>
      <line x1="196" y1="524" x2="208" y2="524" stroke="#28495A" stroke-width="1.5"/>
      <text x="235" y="513" fill="#28495A" font-size="11" font-weight="700">WAL</text>
      <text x="235" y="527" fill="#567F8D" font-size="9">Write-ahead log</text>
      <rect x="330" y="505" width="78" height="22" rx="11" fill="#FFFFFF" stroke="#A8C2CA"/>
      <text x="369" y="520" text-anchor="middle" fill="#28495A" font-size="10" font-weight="700">AES-CTR</text>
    </g>

    <!-- Temp row -->
    <g>
      <rect x="191" y="545" width="28" height="22" rx="3" fill="#FFFFFF" stroke="#28495A" stroke-width="1.5" stroke-dasharray="3,2"/>
      <text x="235" y="552" fill="#28495A" font-size="11" font-weight="700">Temp files</text>
      <text x="235" y="567" fill="#567F8D" font-size="9">Sort &amp; spill files</text>
      <rect x="312" y="544" width="96" height="22" rx="11" fill="#FFFFFF" stroke="#A8C2CA"/>
      <text x="360" y="559" text-anchor="middle" fill="#28495A" font-size="9" font-weight="700">AES-XTS / AES-CBC</text>
    </g>
  </g>

  <!-- Disk -> ciphertext -->
  <line x1="425" y1="500" x2="695" y2="500" stroke="#567F8D" stroke-width="2.5" marker-end="url(#arrowend)"/>

  <!-- Ciphertext box -->
  <g>
    <rect x="700" y="440" width="240" height="110" rx="8" fill="#28495A"/>
    <text x="820" y="465" text-anchor="middle" fill="#E8F2F5" font-family="Consolas, Menlo, monospace" font-size="10">cUEax0Xtnc5CFwEP/O51NBb</text>
    <text x="820" y="482" text-anchor="middle" fill="#E8F2F5" font-family="Consolas, Menlo, monospace" font-size="10">uFNF3ySC6b3qDbkb+Jo+I73</text>
    <text x="820" y="499" text-anchor="middle" fill="#E8F2F5" font-family="Consolas, Menlo, monospace" font-size="10">WcIUS1bjrYoClmE0ugAzKWj/</text>
    <text x="820" y="516" text-anchor="middle" fill="#E8F2F5" font-family="Consolas, Menlo, monospace" font-size="10">e8PRWaTcIw1uAB+uk=</text>
  </g>

  <text x="820" y="578" text-anchor="middle" fill="#28495A" font-size="13" font-weight="700">Database file contents unintelligible,</text>
  <text x="820" y="598" text-anchor="middle" fill="#28495A" font-size="13" font-weight="700">even to system administrators</text>
</svg>
