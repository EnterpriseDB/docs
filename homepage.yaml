# yaml-language-server: $schema=https://raw.githubusercontent.com/EnterpriseDB/docs/refs/heads/develop/tools/schemas/homepage.schema.json
# The documentation landing page (https://www.enterprisedb.com/docs/).
#
# Products place themselves on the page with a `homepage:` entry in their
# .registry.yaml (group, section, label, subtitle, order, href). This file holds
# everything else: the page's groups and their order, the links that aren't a
# product's root page, the "What's new" cards and the footer links.
#
# Entries in a group (products and `links` here) are sorted together by `order`.
# In a wide group, entries without a `section` come before sectioned ones, and
# sections appear in the order listed. Icons are "<set>/<Symbol>" names from
# @enterprisedb/icons.

banner:
  title: EDB Postgres® AI
  href: /edb-postgres-ai/
  icon: edb_logos/LoopColor

groups:
  - id: databases
    heading: Databases
    icon: default/Database
    href: /edb-postgres-ai/databases
    layout: card

  - id: analytics
    heading: Analytics
    icon: default/Improve
    href: /edb-postgres-ai/analytics
    layout: card
    links:
      - label: WarehousePG
        href: /supported-open-source/warehousepg/
        order: 20

  - id: agent-factory
    heading: Agent Factory
    icon: default/BrainCircuit
    href: /edb-postgres-ai/agent-factory
    layout: card
    links:
      - {label: Search, href: /edb-postgres-ai/agent-factory/search, order: 10}
      - {label: Context, href: /edb-postgres-ai/agent-factory/context, order: 20}
      - {label: Runtime, href: /edb-postgres-ai/agent-factory/runtime, order: 30}
      - {label: Governance, href: /edb-postgres-ai/agent-factory/governance, order: 40}
      - {label: Packages, href: /edb-postgres-ai/agent-factory/packages, order: 50}

  - id: hybrid-management
    heading: Hybrid Management
    icon: default/Module
    href: /edb-postgres-ai/latest/hybrid-manager
    layout: card
    links:
      - label: Overview
        href: /edb-postgres-ai/latest/hybrid-manager/overview/
        order: 10
      - label: Using Hybrid Manager
        href: /edb-postgres-ai/latest/hybrid-manager/using_hybrid_manager
        order: 20
      - label: Analytics
        href: /edb-postgres-ai/latest/hybrid-manager/analytics/
        order: 30
      - label: Sovereign AI
        href: /edb-postgres-ai/latest/hybrid-manager/ai-factory/
        order: 40
      - label: Migrations
        href: /edb-postgres-ai/latest/hybrid-manager/using_hybrid_manager/migration
        order: 50

  - id: repositories
    heading: Repositories and Downloading
    icon: default/Download
    href: /repos/
    layout: wide
    links:
      - label: Get your token
        href: /repos/getting_started/get_your_token/
        order: 10
      - label: Getting started
        href: /repos/getting_started/
        order: 20
      - label: Working with repositories
        href: /repos/working_with_repos/
        order: 30

  - id: platforms
    heading: Platforms
    icon: default/IdeaSharing
    href: /edb-postgres-ai/platforms-and-tools/
    layout: wide
    sections:
      - id: kubernetes
        heading: Kubernetes
        icon: logos/Kubernetes
        href: /edb-postgres-ai/platforms-and-tools/kubernetes/

  - id: tools
    heading: Tools
    icon: default/Toolbox
    href: /edb-postgres-ai/platforms-and-tools/
    layout: wide
    sections:
      - id: management
        heading: Management and Monitoring
        icon: default/Control
        href: /edb-postgres-ai/platforms-and-tools/management/
      - id: security
        heading: Security
        icon: default/Security
        href: /edb-postgres-ai/platforms-and-tools/security/
      - id: automation
        heading: Automation
        icon: default/Instances
      - id: high-availability
        heading: High Availability
        icon: default/HighAvailability
        href: /edb-postgres-ai/platforms-and-tools/high-availability/
      - id: backup
        heading: Backup and Recovery
        icon: default/Backup
        href: /edb-postgres-ai/platforms-and-tools/backup/
      - id: migration
        heading: Migration
        icon: default/Migration
        href: /migrating/
      - id: connection-poolers
        heading: Connection Poolers
        icon: default/Connect
        href: /edb-postgres-ai/integration/#connection-poolers
      - id: edb-postgres-tools
        heading: EDB Postgres Tools
        icon: default/Tools
        href: /tools
    links:
      - label: EDB Postgres Distributed (PGD)
        href: /pgd/latest
        section: high-availability
        order: 110
      - label: Data Migration Service
        href: /edb-postgres-ai/latest/hybrid-manager/using_hybrid_manager/migration/
        section: migration
        order: 230
      - label: EDB Agent
        href: /tools/agent
        section: edb-postgres-tools
        order: 280

  - id: extensions
    heading: Extensions
    icon: default/Extension
    href: /pg_extensions
    layout: wide
    links:
      - label: pgvector
        href: /pg_extensions/pgvector
        order: 80

  - id: integration
    heading: Integration
    icon: default/Integration
    href: /edb-postgres-ai/integration
    layout: wide
    sections:
      - id: connectors
        heading: Connectors
        href: /edb-postgres-ai/integration#connectors
      - id: foreign-data-wrappers
        heading: Foreign Data Wrappers
        href: /edb-postgres-ai/integration#foreign-data-wrappers
      - id: developer-tools
        heading: Developer Tools
        href: /edb-postgres-ai/integration#developer-tools

  - id: third-party
    heading: Third Party Integrations
    icon: default/Handshake
    layout: wide
    links:
      - label: Thales CipherTrust Manager
        href: /partner_docs/ThalesCipherTrustManager
        order: 10
      - label: Thales CipherTrust Transparent Encryption
        href: /partner_docs/ThalesCipherTrustTransparentEncryption
        order: 20
      - label: HPE
        href: /partner_docs/HPE
        order: 30

footerLinks:
  - label: EDB Home
    href: https://www.enterprisedb.com/
  - label: Knowledge Base and Technical Alerts
    href: https://knowledge.enterprisedb.com/
  - label: Contact Us
    href: https://www.enterprisedb.com/contact
  - label: Have feedback?
    href: /community/contributing/
